spring.application.name=smsweb

# DATA CONFIGURATION
# Credentials come from environment variables so no secret is committed.
# DB_USERNAME defaults to root. DB_PASSWORD has no default: if it is not
# set, Spring passes the literal text "${DB_PASSWORD}" to MySQL and startup
# fails with "Access denied for user 'root'@'localhost' (using password: YES)".
spring.datasource.url=jdbc:mysql://localhost:3306/sms_web
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# HIBERNATE
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# SQL echo and DEBUG/TRACE web logging live in application-dev.properties:
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

# Server
server.port=8080

# Render LocalDate form fields as yyyy-MM-dd, the only format an
# <input type="date"> accepts. The default is a locale-dependent short
# style such as 12/10/26, which browsers reject, so every edit form
# opened with an empty date box and could not be saved without re-entry.
spring.mvc.format.date=iso

# Photo uploads: 2 MB per file, 3 MB per request (the form fields ride
# along). Was 100 MB. Larger uploads get the 413 page from
# GlobalExceptionHandler; keep the "2 MB" in the form hints in step (#7).
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Printed at the top of fee receipts (E9). Set INSTITUTION_NAME to use
# your own; the default is the app's name.
sms.institution-name=${INSTITUTION_NAME:Student Management System}