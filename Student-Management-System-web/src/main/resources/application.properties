spring.application.name=smsweb

# DATA CONFIGURATION
# Credentials come from environment variables so no secret is committed.
# DB_USERNAME defaults to root. DB_PASSWORD has no default: if it is not
# set, Spring passes the literal text "${DB_PASSWORD}" to MySQL and startup
# fails with "Access denied for user 'root'@'localhost' (using password: YES)".
spring.datasource.url=jdbc:mysql://localhost:3306/sms_web
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Render LocalDate form fields as yyyy-MM-dd, the only format an
# <input type="date"> accepts. The default is a locale-dependent short
# style such as 12/10/26, which browsers reject, so every edit form
# opened with an empty date box and could not be saved without re-entry.
spring.mvc.format.date=iso

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE