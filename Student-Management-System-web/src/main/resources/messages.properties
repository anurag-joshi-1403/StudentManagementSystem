# Messages for form values Spring cannot convert to the field's type (#33).
# Browsers' number and date boxes normally stop such input, so these show
# only when a request bypasses them. Without this file the form showed
# Spring's raw "Failed to convert property value of type..." text.
#
# Spring looks these codes up from the most specific to the least:
# typeMismatch.<form>.<field>, typeMismatch.<field>, typeMismatch.<type>,
# then plain typeMismatch.

typeMismatch.java.lang.Integer=Please enter a whole number.
typeMismatch.java.lang.Long=Please enter a whole number.
typeMismatch.java.lang.Double=Please enter a number.
typeMismatch.java.math.BigDecimal=Please enter an amount, such as 1500 or 1500.50.
typeMismatch.java.time.LocalDate=Please enter a valid date.
typeMismatch=Please enter a valid value.
