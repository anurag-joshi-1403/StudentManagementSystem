# Development profile: verbose output for debugging. Off by default so a
# normal run stays quiet (#29). Enable it with
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# or SPRING_PROFILES_ACTIVE=dev in the IDE's run configuration.

# Print every SQL statement Hibernate sends, formatted
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Request handling and the full list of mapped endpoints at startup
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
