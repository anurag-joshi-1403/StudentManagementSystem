<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance Report</title>
  </head>

  <body>
    <div class="container my-5" th:fragment="content">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
          <h3 class="mb-0"><i class="bi bi-bar-chart-line me-2"></i>Attendance Report</h3>
          <a th:href="@{/attendance}" class="btn btn-light text-primary fw-semibold d-print-none">
            <i class="bi bi-list-ul me-1"></i>All Records
          </a>
        </div>

        <div class="card-body p-4">
          <!-- Subject filter -->
          <form th:action="@{/attendance/report}" method="get" class="row g-2 mb-4 d-print-none">
            <div class="col-md-6">
              <select name="subjectId" class="form-select" aria-label="Subject">
                <option value="">All subjects</option>
                <option
                  th:each="subject : ${subjects}"
                  th:value="${subject.id}"
                  th:text="${subject.subjectName}"
                  th:selected="${subject.id == subjectId}"
                ></option>
              </select>
            </div>
            <div class="col-md-3">
              <button class="btn btn-primary w-100" type="submit">
                <i class="bi bi-funnel me-1"></i>Filter
              </button>
            </div>
            <div class="col-md-3">
              <a th:href="@{/attendance/report}" class="btn btn-outline-secondary w-100">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
              </a>
            </div>
          </form>

          <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Student</th>
                  <th class="text-end">Present</th>
                  <th class="text-end">Total</th>
                  <th class="text-end">Attendance</th>
                  <th class="text-center">Status</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="row : ${rows}" th:classappend="${row.belowMinimum} ? 'table-danger'">
                  <td>
                    <a th:href="@{/student/view/{id}(id=${row.studentId})}" th:text="${row.studentName}">Student</a>
                  </td>
                  <td class="text-end" th:text="${row.present}"></td>
                  <td class="text-end" th:text="${row.total}"></td>
                  <td class="text-end fw-semibold">
                    <span th:if="${row.hasRecords()}" th:text="${#numbers.formatDecimal(row.percentage, 1, 0)} + '%'"></span>
                    <span th:unless="${row.hasRecords()}" class="text-muted">-</span>
                  </td>
                  <td class="text-center">
                    <span th:if="${row.belowMinimum}" class="badge bg-danger">
                      <i class="bi bi-exclamation-triangle me-1"></i>Below 75%
                    </span>
                    <span th:if="${row.hasRecords() and !row.belowMinimum}" class="badge bg-success">OK</span>
                    <span th:unless="${row.hasRecords()}" class="badge bg-secondary">No records</span>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}">
                  <td colspan="5" class="text-center text-muted py-4">No students yet.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <p class="text-muted small mb-0">
            <i class="bi bi-info-circle me-1"></i>Attendance is the share of records marked Present; Late and Absent are not
            counted as present. Students under
            <span th:text="${#numbers.formatDecimal(minimumPercent, 1, 0)} + '%'">75%</span> are highlighted.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
