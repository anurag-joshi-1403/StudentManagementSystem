<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Attendance Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3
            class="mb-0"
            th:text="${attendance.id == null ? 'Add Attendance' : 'Update Attendance'}"
          ></h3>
        </div>

        <div class="card-body">
          <form
            th:action="${attendance.id == null} ?
                        @{/attendance/save} :
                        @{/attendance/update/{id}(id=${attendance.id})}"
            th:object="${attendance}"
            method="post"
          >
            <!-- Student -->

            <div class="mb-3">
              <label class="form-label"> Student </label>

              <select class="form-select" th:field="*{student}" required>
                <option value="">Select Student</option>

                <option
                  th:each="student : ${students}"
                  th:value="${student.id}"
                  th:text="${student.firstName + ' ' + student.lastName}"
                ></option>
              </select>
            </div>

            <!-- Subject -->

            <div class="mb-3">
              <label class="form-label"> Subject </label>

              <select class="form-select" th:field="*{subject}" required>
                <option value="">Select Subject</option>

                <option
                  th:each="subject : ${subjects}"
                  th:value="${subject.id}"
                  th:text="${subject.subjectName}"
                ></option>
              </select>
            </div>

            <!-- Attendance Date -->

            <div class="mb-3">
              <label class="form-label"> Attendance Date </label>

              <input
                type="date"
                class="form-control"
                th:field="*{attendanceDate}"
                required
              />
            </div>

            <!-- Status -->

            <div class="mb-3">
              <label class="form-label"> Status </label>

              <select class="form-select" th:field="*{status}" required>
                <option value="">Select Status</option>

                <option value="Present">Present</option>

                <option value="Absent">Absent</option>

                <option value="Late">Late</option>
              </select>
            </div>

            <!-- Remarks -->

            <div class="mb-3">
              <label class="form-label"> Remarks </label>

              <textarea class="form-control" rows="3" th:field="*{remarks}">
              </textarea>
            </div>

            <!-- Buttons -->

            <div class="d-flex justify-content-between">
              <a th:href="@{/attendance}" class="btn btn-secondary"> Back </a>

              <button type="submit" class="btn btn-success">
                Save Attendance
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
