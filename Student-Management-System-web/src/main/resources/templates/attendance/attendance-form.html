<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${attendance.id == null ? 'Record Attendance' : 'Update Attendance'} + ' | Student Management System'">Attendance Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="bg-light">
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
              <h3 class="mb-0 text-center">
                <i class="bi bi-calendar-check-fill me-2"></i>
                <span th:text="${attendance.id == null ? 'Record Attendance' : 'Update Attendance Record'}">Attendance Form</span>
              </h3>
            </div>

            <div class="card-body p-4">
              <form
                th:action="${attendance.id == null} ? @{/attendance/save} : @{/attendance/update/{id}(id=${attendance.id})}"
                th:object="${attendance}"
                method="post"
              >
                <!-- Hidden ID on update -->
                <input type="hidden" th:field="*{id}" />

                <!-- Student & Subject Row -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Student <span class="text-danger">*</span></label>
                    <select
                      class="form-select"
                      th:field="*{student}"
                      th:classappend="${#fields.hasErrors('student')} ? 'is-invalid'"
                      required
                    >
                      <option value="">-- Select Student --</option>
                      <option
                        th:each="student : ${students}"
                        th:value="${student.id}"
                        th:text="${student.firstName + ' ' + student.lastName + ' (ID: ' + student.id + ')'}"
                      ></option>
                    </select>
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('student')}"
                      th:errors="*{student}"
                    ></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Subject <span class="text-danger">*</span></label>
                    <select
                      class="form-select"
                      th:field="*{subject}"
                      th:classappend="${#fields.hasErrors('subject')} ? 'is-invalid'"
                      required
                    >
                      <option value="">-- Select Subject --</option>
                      <option
                        th:each="subject : ${subjects}"
                        th:value="${subject.id}"
                        th:text="${subject.subjectName + ' (' + subject.subjectCode + ')'}"
                      ></option>
                    </select>
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('subject')}"
                      th:errors="*{subject}"
                    ></div>
                  </div>
                </div>

                <!-- Date & Status Row -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Attendance Date <span class="text-danger">*</span></label>
                    <input
                      type="date"
                      class="form-control"
                      th:field="*{attendanceDate}"
                      th:classappend="${#fields.hasErrors('attendanceDate')} ? 'is-invalid'"
                      required
                    />
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('attendanceDate')}"
                      th:errors="*{attendanceDate}"
                    ></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Status <span class="text-danger">*</span></label>
                    <select
                      class="form-select"
                      th:field="*{status}"
                      th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'"
                      required
                    >
                      <option value="">-- Select Status --</option>
                      <option value="Present">Present</option>
                      <option value="Absent">Absent</option>
                      <option value="Late">Late</option>
                    </select>
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('status')}"
                      th:errors="*{status}"
                    ></div>
                  </div>
                </div>

                <!-- Remarks Row -->
                <div class="mb-4">
                  <label class="form-label fw-semibold">Remarks (Optional)</label>
                  <textarea
                    class="form-control"
                    rows="3"
                    th:field="*{remarks}"
                    placeholder="e.g. Medical leave, late due to transport, etc."
                  ></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                  <a th:href="@{/attendance}" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancel
                  </a>
                  <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-check-circle me-1"></i>Save Attendance
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
