<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Management | Student Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="bg-light">
    <div class="container my-5">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
          <h3 class="mb-0"><i class="bi bi-calendar-check-fill me-2"></i>Attendance Management</h3>
          <a th:href="@{/attendance/new}" class="btn btn-light text-primary fw-semibold">
            <i class="bi bi-plus-circle me-1"></i>Record Attendance
          </a>
        </div>

        <div class="card-body p-4">
          <!-- Search Form -->
          <form th:action="@{/attendance/search}" method="get" class="row g-2 mb-4">
            <div class="col-md-5">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input
                  type="text"
                  name="keyword"
                  class="form-control"
                  placeholder="Search by Student or Subject name..."
                  th:value="${keyword}"
                />
              </div>
            </div>

            <div class="col-md-3">
              <input
                type="date"
                name="attendanceDate"
                class="form-control"
                th:value="${attendanceDate}"
              />
            </div>

            <div class="col-md-2">
              <button class="btn btn-primary w-100" type="submit">
                <i class="bi bi-funnel me-1"></i>Filter
              </button>
            </div>

            <div class="col-md-2">
              <a th:href="@{/attendance}" class="btn btn-outline-secondary w-100">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
              </a>
            </div>
          </form>

          <!-- Attendance Table -->
          <div class="table-responsive">
            <table class="table table-hover table-bordered align-middle">
              <thead class="table-dark">
                <tr>
                  <th width="60">ID</th>
                  <th>Student</th>
                  <th>Subject</th>
                  <th>Date</th>
                  <th width="120" class="text-center">Status</th>
                  <th>Remarks</th>
                  <th width="140" class="text-center">Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="attendance : ${attendanceList}">
                  <td class="text-muted" th:text="${attendance.id}"></td>
                  <td class="fw-semibold" th:text="${attendance.student.firstName + ' ' + attendance.student.lastName}"></td>
                  <td th:text="${attendance.subject.subjectName}"></td>
                  <td th:text="${attendance.attendanceDate}"></td>
                  <td class="text-center">
                    <span th:if="${attendance.status == 'Present'}" class="badge bg-success">
                      <i class="bi bi-check-circle me-1"></i>Present
                    </span>
                    <span th:if="${attendance.status == 'Absent'}" class="badge bg-danger">
                      <i class="bi bi-x-circle me-1"></i>Absent
                    </span>
                    <span th:if="${attendance.status == 'Late'}" class="badge bg-warning text-dark">
                      <i class="bi bi-clock-history me-1"></i>Late
                    </span>
                    <span
                      th:if="${attendance.status != 'Present' and attendance.status != 'Absent' and attendance.status != 'Late'}"
                      class="badge bg-secondary"
                      th:text="${attendance.status}"
                    ></span>
                  </td>
                  <td th:text="${attendance.remarks != null and !attendance.remarks.isEmpty() ? attendance.remarks : '-'}"></td>
                  <td class="text-center">
                    <a
                      th:href="@{/attendance/edit/{id}(id=${attendance.id})}"
                      class="btn btn-warning btn-sm me-1"
                      title="Edit Attendance"
                    >
                      <i class="bi bi-pencil-square"></i>
                    </a>
                    <a
                      th:href="@{/attendance/delete/{id}(id=${attendance.id})}"
                      class="btn btn-danger btn-sm"
                      title="Delete Attendance"
                      onclick="return confirm('Are you sure you want to delete this attendance record?');"
                    >
                      <i class="bi bi-trash"></i>
                    </a>
                  </td>
                </tr>

                <tr th:if="${#lists.isEmpty(attendanceList)}">
                  <td colspan="7" class="text-center text-muted py-4">
                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                    No attendance records found.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Total Counter & Pagination -->
          <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
            <span class="text-muted">
              Total Records: <strong class="text-dark" th:text="${totalItems != null ? totalItems : (totalAttendance != null ? totalAttendance : 0)}">0</strong>
            </span>

            <nav th:if="${totalPages != null and totalPages > 1}">
              <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                  <a class="page-link" th:href="@{/attendance/page/{page}(page=${currentPage - 1})}">
                    <i class="bi bi-chevron-left"></i> Previous
                  </a>
                </li>
                <li
                  class="page-item"
                  th:each="i : ${#numbers.sequence(1, totalPages)}"
                  th:classappend="${currentPage == i} ? 'active'"
                >
                  <a
                    class="page-link"
                    th:href="@{/attendance/page/{page}(page=${i})}"
                    th:text="${i}"
                  ></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                  <a class="page-link" th:href="@{/attendance/page/{page}(page=${currentPage + 1})}">
                    Next <i class="bi bi-chevron-right"></i>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
