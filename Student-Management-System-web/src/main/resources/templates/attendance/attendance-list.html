<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Attendance Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Attendance Management</h2>

        <a th:href="@{/attendance/new}" class="btn btn-primary">
          + Add Attendance
        </a>
      </div>

      <!-- Search Form -->

      <form th:action="@{/attendance/search}" method="get" class="row g-3 mb-4">
        <div class="col-md-5">
          <input
            type="text"
            name="keyword"
            class="form-control"
            placeholder="Search by Student or Subject"
          />
        </div>

        <div class="col-md-3">
          <input type="date" name="attendanceDate" class="form-control" />
        </div>

        <div class="col-md-2">
          <button class="btn btn-success w-100">Search</button>
        </div>

        <div class="col-md-2">
          <a th:href="@{/attendance}" class="btn btn-secondary w-100">
            Reset
          </a>
        </div>
      </form>

      <!-- Attendance Table -->

      <table class="table table-bordered table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>ID</th>

            <th>Student</th>

            <th>Subject</th>

            <th>Date</th>

            <th>Status</th>

            <th>Remarks</th>

            <th width="170">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="attendance : ${attendanceList}">
            <td th:text="${attendance.id}"></td>

            <td th:text="${attendance.student.firstName}"></td>

            <td th:text="${attendance.subject.subjectName}"></td>

            <td th:text="${attendance.attendanceDate}"></td>

            <td>
              <span th:text="${attendance.status}" class="badge bg-success">
              </span>
            </td>

            <td th:text="${attendance.remarks}"></td>

            <td>
              <a
                th:href="@{/attendance/edit/{id}(id=${attendance.id})}"
                class="btn btn-warning btn-sm"
              >
                Edit
              </a>

              <a
                th:href="@{/attendance/delete/{id}(id=${attendance.id})}"
                class="btn btn-danger btn-sm"
                onclick="return confirm('Delete this attendance record?');"
              >
                Delete
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination -->

      <nav th:if="${totalPages != null && totalPages > 1}">
        <ul class="pagination justify-content-center">
          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(1,totalPages)}"
          >
            <a
              class="page-link"
              th:href="@{/attendance/page/{page}(page=${i})}"
              th:text="${i}"
            >
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
