<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exam Schedule</title>
  </head>

  <body>
    <div class="container mt-4" th:fragment="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-calendar3 me-2"></i>Exam Schedule</h2>
        <a th:href="@{/exam}" class="btn btn-secondary d-print-none">
          <i class="bi bi-list-ul me-1"></i>All Exams
        </a>
      </div>

      <p class="text-muted">Exams from today onwards, by month.</p>

      <!--/* schedule is a TreeMap<YearMonth, List<Exam>>, so months arrive in
           calendar order and each month's exams in date order. */-->
      <div class="card shadow-sm mb-4" th:each="month : ${schedule}">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0" th:text="${#temporals.format(month.key.atDay(1), 'MMMM yyyy')}">Month</h5>
          <span
            class="badge bg-light text-primary"
            th:text="${#lists.size(month.value)} + (${#lists.size(month.value)} == 1 ? ' exam' : ' exams')"
          >0 exams</span>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th width="22%">Date</th>
                <th>Exam</th>
                <th>Subject</th>
                <th class="text-end">Total Marks</th>
                <th class="text-end">Passing Marks</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="exam : ${month.value}">
                <td class="fw-semibold" th:text="${#temporals.format(exam.examDate, 'EEE, dd MMM')}">Date</td>
                <td>
                  <a th:href="@{/exam/view/{id}(id=${exam.id})}" th:text="${exam.examName}">Exam</a>
                </td>
                <td th:text="${exam.subject.subjectName}"></td>
                <td class="text-end" th:text="${exam.totalMarks}"></td>
                <td class="text-end" th:text="${exam.passingMarks}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div th:if="${#maps.isEmpty(schedule)}" class="alert alert-info">
        <i class="bi bi-info-circle me-1"></i>No upcoming exams.
      </div>
    </div>
  </body>
</html>
