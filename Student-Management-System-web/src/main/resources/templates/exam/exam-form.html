<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Exam Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"
                th:text="${exam.id == null ? 'Add Exam' : 'Update Exam'}">
            </h3>
        </div>

        <div class="card-body">

            <form
                    th:action="${exam.id == null} ?
                    @{/exam/save} :
                    @{/exam/update/{id}(id=${exam.id})}"
                    th:object="${exam}"
                    method="post">

                <!-- Exam Name -->

                <div class="mb-3">
                    <label class="form-label">Exam Name</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{examName}"
                           placeholder="Enter Exam Name"
                           required>
                </div>

                <!-- Subject -->

                <div class="mb-3">
                    <label class="form-label">Subject</label>

                    <select class="form-select"
                            th:field="*{subject}"
                            required>

                        <option value="">Select Subject</option>

                        <option
                                th:each="subject : ${subjects}"
                                th:value="${subject.id}"
                                th:text="${subject.subjectName}">
                        </option>

                    </select>

                </div>

                <!-- Exam Date -->

                <div class="mb-3">
                    <label class="form-label">Exam Date</label>

                    <input type="date"
                           class="form-control"
                           th:field="*{examDate}"
                           required>
                </div>

                <!-- Total Marks -->

                <div class="mb-3">
                    <label class="form-label">Total Marks</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{totalMarks}"
                           min="1"
                           placeholder="Enter Total Marks"
                           required>
                </div>

                <!-- Passing Marks -->

                <div class="mb-3">
                    <label class="form-label">Passing Marks</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{passingMarks}"
                           min="1"
                           placeholder="Enter Passing Marks"
                           required>
                </div>

                <!-- Buttons -->

                <div class="d-flex justify-content-between">

                    <a th:href="@{/exam}"
                       class="btn btn-secondary">
                        Back
                    </a>

                    <button type="submit"
                            class="btn btn-success">

                        <span th:text="${exam.id == null ? 'Save Exam' : 'Update Exam'}"></span>

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
