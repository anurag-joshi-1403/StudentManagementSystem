<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Exam Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Exam Management</h2>

        <a th:href="@{/exam/new}" class="btn btn-primary"> + Add Exam </a>
      </div>

      <!-- Search -->

      <form th:action="@{/exam/search}" method="get" class="row g-3 mb-4">
        <div class="col-md-5">
          <input
            type="text"
            name="keyword"
            class="form-control"
            placeholder="Search by Exam or Subject"
          />
        </div>

        <div class="col-md-3">
          <input type="date" name="examDate" class="form-control" />
        </div>

        <div class="col-md-2">
          <button class="btn btn-success w-100">Search</button>
        </div>

        <div class="col-md-2">
          <a th:href="@{/exam}" class="btn btn-secondary w-100"> Reset </a>
        </div>
      </form>

      <!-- Table -->

      <table class="table table-bordered table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Exam Name</th>
            <th>Subject</th>
            <th>Exam Date</th>
            <th>Total Marks</th>
            <th>Passing Marks</th>
            <th width="170">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="exam : ${examList}">
            <td th:text="${exam.id}"></td>

            <td th:text="${exam.examName}"></td>

            <td th:text="${exam.subject.subjectName}"></td>

            <td th:text="${exam.examDate}"></td>

            <td th:text="${exam.totalMarks}"></td>

            <td th:text="${exam.passingMarks}"></td>

            <td>
              <a
                th:href="@{/exam/edit/{id}(id=${exam.id})}"
                class="btn btn-warning btn-sm"
              >
                Edit
              </a>

              <a
                th:href="@{/exam/delete/{id}(id=${exam.id})}"
                class="btn btn-danger btn-sm"
                onclick="return confirm('Delete this exam?');"
              >
                Delete
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination -->

      <nav th:if="${totalPages != null && totalPages > 1}">
        <ul class="pagination justify-content-center">
          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(1,totalPages)}"
          >
            <a
              class="page-link"
              th:href="@{/exam/page/{page}(page=${i})}"
              th:text="${i}"
            >
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
