<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <title>Exam Management</title>

  </head>

  <body>
    <div class="container mt-4" th:fragment="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Exam Management</h2>

        <div class="d-flex gap-2">
          <a th:href="@{/exam/schedule}" class="btn btn-outline-primary">
            <i class="bi bi-calendar3 me-1"></i>Schedule
          </a>
          <a th:href="@{/exam/new}" sec:authorize="hasAnyRole('ADMIN', 'TEACHER')" class="btn btn-primary"> + Add Exam </a>
        </div>
      </div>

      <!-- Search -->

      <form th:action="@{/exam/search}" method="get" class="row g-3 mb-4">
        <div class="col-md-5">
          <input
            type="text"
            name="keyword"
            class="form-control"
            placeholder="Search by Exam or Subject"
            th:value="${keyword}"
          />
        </div>

        <div class="col-md-3">
          <input
            type="date"
            name="examDate"
            class="form-control"
            th:value="${examDate}"
          />
        </div>

        <div class="col-md-2">
          <button class="btn btn-success w-100">Search</button>
        </div>

        <div class="col-md-2">
          <a th:href="@{/exam}" class="btn btn-secondary w-100"> Reset </a>
        </div>
      </form>

      <!-- Table -->

      <table class="table table-bordered table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Exam Name</th>
            <th>Subject</th>
            <th>Exam Date</th>
            <th>Total Marks</th>
            <th>Passing Marks</th>
            <th width="210">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="exam : ${examList}">
            <td th:text="${exam.id}"></td>

            <td th:text="${exam.examName}"></td>

            <td th:text="${exam.subject.subjectName}"></td>

            <td th:text="${exam.examDate}"></td>

            <td th:text="${exam.totalMarks}"></td>

            <td th:text="${exam.passingMarks}"></td>

            <td>
              <a
                th:href="@{/exam/view/{id}(id=${exam.id})}"
                class="btn btn-info btn-sm text-white"
              >
                View
              </a>

              <!--/* Everyone may view; admins and teachers may change (C9) */-->
              <th:block sec:authorize="hasAnyRole('ADMIN', 'TEACHER')">
              <a
                th:href="@{/exam/edit/{id}(id=${exam.id})}"
                class="btn btn-warning btn-sm"
              >
                Edit
              </a>

              <!--/* POST, not a link: a GET delete could be triggered by link
                   prefetch or a crawler, and CSRF protection does not cover GET.
                   th:action adds the CSRF token. */-->
              <form
                th:action="@{/exam/delete/{id}(id=${exam.id})}"
                method="post"
                class="d-inline"
                onsubmit="return confirm('Delete this exam?');"
              >
                <button type="submit" class="btn btn-danger btn-sm">
                  Delete
                </button>
              </form>
              </th:block>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(examList)}">
            <td colspan="7" class="text-center text-muted">No exams found.</td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination -->

      <nav th:if="${totalPages != null && totalPages > 1}">
        <ul class="pagination justify-content-center">
          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(1,totalPages)}"
          >
            <a
              class="page-link"
              th:href="@{/exam/search(keyword=${keyword}, examDate=${examDate}, page=${i})}"
              th:text="${i}"
            >
            </a>
          </li>
        </ul>
      </nav>
    </div>

  </body>
</html>
