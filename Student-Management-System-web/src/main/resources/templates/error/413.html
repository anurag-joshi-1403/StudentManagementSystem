<!doctype html>
<!--/* Rendered by GlobalExceptionHandler when an upload is over the size
     limit in application.properties (keep the "2 MB" below in step). */-->
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{common/error-page :: page('413', 'Photo too large',
    'Photos can be up to 2 MB. Go back and choose a smaller file; nothing was saved.',
    'bi-file-earmark-image')}"
></html>
