<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Subject Details</title>
  </head>

  <body>
    <div class="container mt-5" th:fragment="content">
      <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h3 class="mb-0"><i class="bi bi-journal-bookmark me-2"></i>Subject Details</h3>
          <span class="badge bg-light text-primary fs-6" th:text="${subject.subjectCode}">Code</span>
        </div>

        <div class="card-body">
          <table class="table table-bordered table-striped mt-3">
            <tbody>
              <tr>
                <th width="30%"><i class="bi bi-hash me-2 text-muted"></i>Subject ID</th>
                <td th:text="${subject.id}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-upc-scan me-2 text-muted"></i>Subject Code</th>
                <td th:text="${subject.subjectCode}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-journal-text me-2 text-muted"></i>Subject Name</th>
                <td th:text="${subject.subjectName}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-calendar3 me-2 text-muted"></i>Semester</th>
                <td th:text="${subject.semester}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-award me-2 text-muted"></i>Credits</th>
                <td th:text="${subject.credits}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-building me-2 text-muted"></i>Department</th>
                <td th:text="${subject.department}"></td>
              </tr>
            </tbody>
          </table>

          <!-- Exams for this subject -->
          <h5 class="mt-4 mb-3">
            <i class="bi bi-pencil-square me-2"></i>Exams
            <span class="badge bg-secondary" th:text="${#lists.size(exams)}">0</span>
          </h5>

          <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Exam</th>
                <th>Date</th>
                <th>Total Marks</th>
                <th>Passing Marks</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="exam : ${exams}">
                <td>
                  <a th:href="@{/exam/view/{id}(id=${exam.id})}" th:text="${exam.examName}">Exam</a>
                </td>
                <td th:text="${exam.examDate}"></td>
                <td th:text="${exam.totalMarks}"></td>
                <td th:text="${exam.passingMarks}"></td>
                <td>
                  <span th:if="${exam.examDate.isBefore(#temporals.createToday())}" class="badge bg-secondary">Held</span>
                  <span th:unless="${exam.examDate.isBefore(#temporals.createToday())}" class="badge bg-success">Upcoming</span>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(exams)}">
                <td colspan="5" class="text-center text-muted">No exams for this subject yet.</td>
              </tr>
            </tbody>
          </table>

          <div class="text-center mt-4">
            <a th:href="@{/subject}" class="btn btn-secondary me-2">
              <i class="bi bi-arrow-left me-1"></i>Back to Subjects
            </a>
            <a th:href="@{/subject/edit/{id}(id=${subject.id})}" sec:authorize="hasRole('ADMIN')" class="btn btn-warning">
              <i class="bi bi-pencil-square me-1"></i>Edit Subject
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
