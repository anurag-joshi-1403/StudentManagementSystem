<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Subject Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />~
  </head>

  <body>
    <div class="container mt-4">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h3
            th:text="${subject.id == null ? 'Add Subject' : 'Edit Subject'}"
          ></h3>
        </div>

        <div class="card-body">
          <form th:action="@{/subject}" th:object="${subject}" method="post">
            <!-- Hidden ID -->

            <input type="hidden" th:field="*{id}" />

            <!-- Duplicate Error -->

            <div
              class="alert alert-danger"
              th:if="${duplicateError}"
              th:text="${duplicateError}"
            ></div>

            <!-- Subject Code -->

            <div class="mb-3">
              <label class="form-label"> Subject Code </label>

              <input
                type="text"
                class="form-control"
                th:field="*{subjectCode}"
              />

              <div class="text-danger" th:errors="*{subjectCode}"></div>
            </div>

            <!-- Subject Name -->

            <div class="mb-3">
              <label class="form-label"> Subject Name </label>

              <input
                type="text"
                class="form-control"
                th:field="*{subjectName}"
              />

              <div class="text-danger" th:errors="*{subjectName}"></div>
            </div>

            <!-- Semester -->

            <div class="mb-3">
              <label class="form-label"> Semester </label>

              <input
                type="number"
                class="form-control"
                th:field="*{semester}"
              />

              <div class="text-danger" th:errors="*{semester}"></div>
            </div>

            <!-- Credits -->

            <div class="mb-3">
              <label class="form-label"> Credits </label>

              <input type="number" class="form-control" th:field="*{credits}" />

              <div class="text-danger" th:errors="*{credits}"></div>
            </div>

            <!-- Department -->

            <div class="mb-3">
              <label class="form-label"> Department </label>

              <input
                type="text"
                class="form-control"
                th:field="*{department}"
              />

              <div class="text-danger" th:errors="*{department}"></div>
            </div>

            <!-- Buttons -->

            <button type="submit" class="btn btn-success">Save</button>

            <a th:href="@{/subject}" class="btn btn-secondary"> Cancel </a>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
