<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Subject Management</title>


  </head>

  <body>
    <div class="container mt-4" th:fragment="content">
      <div class="row mb-3">
        <div class="col-md-4">
          <h2>Subject List</h2>
        </div>

        <div class="col-md-4">
          <form th:action="@{/subject}" method="get">
            <div class="input-group">
              <input
                type="text"
                name="keyword"
                class="form-control"
                placeholder="Search Subject..."
                th:value="${keyword}"
              />

              <button class="btn btn-primary" type="submit">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </form>
        </div>

        <div class="col-md-4 text-end">
          <a th:href="@{/subject/new}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i>

            Add Subject
          </a>
        </div>
      </div>

      <table class="table table-bordered table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Subject Name</th>
            <th>Semester</th>
            <th>Credits</th>
            <th>Department</th>
            <th width="180">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="subject : ${subjects}">
            <td th:text="${subject.id}"></td>

            <td th:text="${subject.subjectCode}"></td>

            <td th:text="${subject.subjectName}"></td>

            <td th:text="${subject.semester}"></td>

            <td th:text="${subject.credits}"></td>

            <td th:text="${subject.department}"></td>

            <td>
              <a
                th:href="@{/subject/edit/{id}(id=${subject.id})}"
                class="btn btn-warning btn-sm"
              >
                <i class="bi bi-pencil-square"></i>
              </a>

              <a
                th:href="@{/subject/delete/{id}(id=${subject.id})}"
                class="btn btn-danger btn-sm"
                onclick="
                  return confirm(
                    'Are you sure you want to delete this subject?',
                  );
                "
              >
                <i class="bi bi-trash"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination -->

      <nav th:if="${totalPages != null && totalPages > 1}">
        <ul class="pagination justify-content-center">
          <li
            class="page-item"
            th:classappend="${currentPage == 1} ? 'disabled'"
          >
            <a class="page-link" th:href="@{/subject(page=${currentPage-1})}">
              Previous
            </a>
          </li>

          <li class="page-item disabled">
            <span class="page-link">
              Page [[${currentPage}]] of [[${totalPages}]]
            </span>
          </li>

          <li
            class="page-item"
            th:classappend="${currentPage == totalPages} ? 'disabled'"
          >
            <a class="page-link" th:href="@{/subject(page=${currentPage+1})}">
              Next
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
