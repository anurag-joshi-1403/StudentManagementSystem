<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Fee Management</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Fee Management</h2>

        <a th:href="@{/fee/new}" class="btn btn-primary"> Add Fee </a>
      </div>

      <form th:action="@{/fee/search}" method="get" class="mb-3">
        <div class="input-group">
          <input
            type="text"
            name="keyword"
            class="form-control"
            placeholder="Search Student / Fee Type / Status"
            th:value="${keyword}"
          />

          <button class="btn btn-success">Search</button>
        </div>
      </form>

      <table class="table table-bordered table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Fee Type</th>
            <th>Amount</th>
            <th>Due Date</th>
            <th>Payment Date</th>
            <th>Status</th>
            <th>Method</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="fee : ${fees}">
            <td th:text="${fee.id}"></td>

            <td
              th:text="${fee.student.firstName + ' ' + fee.student.lastName}"
            ></td>

            <td th:text="${fee.feeType}"></td>

            <td th:text="${fee.amount}"></td>

            <td th:text="${fee.dueDate}"></td>

            <td th:text="${fee.paymentDate}"></td>

            <td>
              <span
                th:if="${fee.paymentStatus=='Paid'}"
                class="badge bg-success"
              >
                Paid
              </span>

              <span
                th:if="${fee.paymentStatus=='Pending'}"
                class="badge bg-warning text-dark"
              >
                Pending
              </span>
            </td>

            <td th:text="${fee.paymentMethod}"></td>

            <td>
              <a
                th:href="@{/fee/edit/{id}(id=${fee.id})}"
                class="btn btn-warning btn-sm"
              >
                Edit
              </a>

              <a
                th:href="@{/fee/delete/{id}(id=${fee.id})}"
                class="btn btn-danger btn-sm"
                onclick="return confirm('Delete this fee record?');"
              >
                Delete
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="mt-3">
        <strong>Total Fee Records :</strong>

        <span th:text="${totalFees}"></span>
      </div>

      <!-- Pagination -->

      <nav class="mt-4">
        <ul class="pagination">
          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(1,totalPages)}"
          >
            <a
              class="page-link"
              th:href="@{/fee/page/{page}(page=${i})}"
              th:text="${i}"
            >
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
