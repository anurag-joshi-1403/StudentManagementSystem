<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <title>Course Management System</title>

  </head>

  <body>
    <div class="container mt-5" th:fragment="content">
      <h2 class="text-center mb-4">Course Management System</h2>

      <div class="card shadow">
        <div class="card-body">
          <div class="row align-items-center mb-3">
            <div class="col-md-3">
              <h4 class="mb-0">Course List</h4>
            </div>

            <div class="col-md-9">
              <div class="d-flex justify-content-end">
                <form th:action="@{/course}" method="get" class="d-flex me-2">
                  <input
                    type="text"
                    name="keyword"
                    class="form-control"
                    placeholder="Search by Code or Name"
                    th:value="${keyword}"
                  />

                  <button type="submit" class="btn btn-success ms-2">
                    Search
                  </button>
                </form>

                <a th:href="@{/course/new}" sec:authorize="hasRole('ADMIN')" class="btn btn-primary">
                  Add Course
                </a>
              </div>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-bordered table-hover">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>

                  <th>Course Code</th>

                  <th>Course Name</th>

                  <th>Duration</th>

                  <th>Fees</th>

                  <th>Description</th>

                  <th>Action</th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="course : ${courses}">
                  <td th:text="${course.id}"></td>

                  <td th:text="${course.courseCode}"></td>

                  <td th:text="${course.courseName}"></td>

                  <td th:text="${course.duration}"></td>

                  <td th:text="'₹' + ${course.fees}"></td>

                  <td th:text="${course.description}"></td>

                  <td>
                    <a
                      th:href="@{/course/view/{id}(id=${course.id})}"
                      class="btn btn-info btn-sm text-white"
                    >
                      View
                    </a>

                    <a
                      th:href="@{/course/edit/{id}(id=${course.id})}"
                      sec:authorize="hasRole('ADMIN')"
                      class="btn btn-warning btn-sm"
                    >
                      Edit
                    </a>

                    <!--/* POST, not a link: a GET delete could be triggered by link
                         prefetch or a crawler, and CSRF protection does not cover GET.
                         th:action adds the CSRF token. */-->
                    <form
                      th:action="@{/course/delete/{id}(id=${course.id})}"
                      sec:authorize="hasRole('ADMIN')"
                      method="post"
                      class="d-inline"
                      onsubmit="return confirm('Are you sure you want to delete this course?');"
                    >
                      <button type="submit" class="btn btn-danger btn-sm">
                        Delete
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <nav th:if="${totalPages > 1}" class="mt-3">
            <ul class="pagination justify-content-center">
              <!-- Previous Button -->
              <li
                class="page-item"
                th:classappend="${currentPage == 1} ? 'disabled'"
              >
                <a
                  class="page-link"
                  th:href="@{/course(keyword=${keyword}, page=${currentPage-1})}"
                >
                  Previous
                </a>
              </li>

              <!-- Page Numbers -->
              <li
                class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${currentPage == i} ? 'active'"
              >
                <a
                  class="page-link"
                  th:href="@{/course(keyword=${keyword}, page=${i})}"
                  th:text="${i}"
                >
                </a>
              </li>

              <!-- Next Button -->
              <li
                class="page-item"
                th:classappend="${currentPage == totalPages} ? 'disabled'"
              >
                <a
                  class="page-link"
                  th:href="@{/course(keyword=${keyword}, page=${currentPage+1})}"
                >
                  Next
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </body>
</html>
