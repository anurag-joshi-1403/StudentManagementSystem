<!doctype html>
<html lang="en" xmlns:th="https://thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Student Management System</h1>
      <div class="card shadow">
        <div class="card-body">
          <h3 class="mb-4">Student List</h3>
          <div class="mb-3">
            <a th:href="@{/students/new}" class="btn btn-primary"
              >Add Student</a
            >
          </div>
          <form th:action="@{/student/search}" method="get" class="mb-3">
            <div class="input-group">
              <input
                type="text"
                name="keyword"
                class="form-control"
                placeholder="Search by Name, Email or Course"
              />

              <button class="btn btn-success" type="submit">Search</button>
            </div>
          </form>
          <table class="table table-bordered table-hover">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Course</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.firstName}"></td>
                <td th:text="${student.lastName}"></td>
                <td th:text="${student.email}"></td>
                <td th:text="${student.phone}"></td>
                <td th:text="${student.course}"></td>
                <td>
                  <a
                    th:href="@{/student/edit/{id}(id=${student.id})}"
                    class="btn btn-warning btn-sm"
                    >Edit</a
                  >
                  <a
                    th:href="@{/student/delete/{id}(id=${student.id})}"
                    class="btn btn-danger btn-sm"
                    onclick="
                      return confirm(
                        'Are you sure you want to delete this student?',
                      );
                    "
                    >Delete</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
