<!doctype html>
<html lang="en" xmlns:th="https://thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
  </head>

  <body>
    <div class="container mt-5" th:fragment="content">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="mb-4">Student List</h3>
          <div class="mb-3 d-flex flex-wrap gap-2" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/student/new}" class="btn btn-primary">Add Student</a>
            <a th:href="@{/student/import}" class="btn btn-outline-primary">
              <i class="bi bi-upload me-1"></i>Import CSV
            </a>
            <a th:href="@{/student/export}" class="btn btn-outline-secondary">
              <i class="bi bi-download me-1"></i>Export CSV
            </a>
          </div>
          <form th:action="@{/student/search}" method="get" class="mb-3">
            <div class="input-group">
              <input
                type="text"
                name="keyword"
                class="form-control"
                placeholder="Search by Name, Email or Course"
                th:value="${keyword}"
              />

              <button class="btn btn-success" type="submit">Search</button>
            </div>
          </form>
          <table class="table table-bordered table-hover">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Photo</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Course</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>

                <!-- Student Photo -->
                <td>
                  <img
                    th:if="${student.photo != null}"
                    th:src="@{'/student-images/' + ${student.photo}}"
                    width="70"
                    height="70"
                    class="rounded-circle border"
                    style="object-fit: cover"
                  />

                  <img
                    th:unless="${student.photo != null}"
                    th:src="@{/images/default-avatar.svg}"
                    alt="No photo"
                    width="70"
                    height="70"
                    class="rounded-circle border"
                  />
                </td>

                <td th:text="${student.firstName}"></td>

                <td th:text="${student.lastName}"></td>

                <td th:text="${student.email}"></td>

                <td th:text="${student.phone}"></td>

                <td th:text="${student.course}"></td> 

                <td>
                  <a
                    th:href="@{/student/view/{id}(id=${student.id})}"
                    class="btn btn-info btn-sm"
                  >
                    View
                  </a>
                  <a
                    th:href="@{/student/edit/{id}(id=${student.id})}"
                    sec:authorize="hasRole('ADMIN')"
                    class="btn btn-warning btn-sm"
                  >
                    Edit
                  </a>

                  <!--/* POST, not a link: a GET delete could be triggered by link
                       prefetch or a crawler, and CSRF protection does not cover GET.
                       th:action adds the CSRF token. */-->
                  <form
                    th:action="@{/student/delete/{id}(id=${student.id})}"
                    sec:authorize="hasRole('ADMIN')"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('Delete this student?');"
                  >
                    <button type="submit" class="btn btn-danger btn-sm">
                      Delete
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>

          <p class="text-center mt-3">
            Total Students :
            <strong th:text="${totalItems}"></strong>
          </p>

          <!--/* Guarded: with no results totalPages is 0, and
               #numbers.sequence(1, 0) counts DOWN, giving pages "1, 0". */-->
          <p class="text-center" th:if="${totalPages > 1}">
            Page
            <span th:text="${currentPage}"></span>
            of
            <span th:text="${totalPages}"></span>
          </p>

          <!--/* Links carry the keyword, so page 2 of a search stays a search (#11). */-->
          <nav aria-label="Page navigation" th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center">
              <!-- Previous Button -->

              <li
                class="page-item"
                th:classappend="${currentPage == 1} ? 'disabled'"
              >
                <a
                  class="page-link"
                  th:href="@{/student/search(keyword=${keyword}, page=${currentPage-1})}"
                >
                  Previous
                </a>
              </li>

              <!-- Page Numbers -->

              <li
                class="page-item"
                th:each="i : ${#numbers.sequence(1,totalPages)}"
                th:classappend="${currentPage == i} ? 'active'"
              >
                <a
                  class="page-link"
                  th:href="@{/student/search(keyword=${keyword}, page=${i})}"
                  th:text="${i}"
                >
                </a>
              </li>

              <!-- Next Button -->

              <li
                class="page-item"
                th:classappend="${currentPage == totalPages} ? 'disabled'"
              >
                <a
                  class="page-link"
                  th:href="@{/student/search(keyword=${keyword}, page=${currentPage+1})}"
                >
                  Next
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </body>
</html>
