<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Student Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3 class="text-center">Student Profile</h3>
        </div>

        <div class="card-body">
          <div class="text-center mb-4">
            <img
              th:if="${student.photo != null}"
              th:src="@{'/student-images/' + ${student.photo}}"
              class="rounded-circle border shadow"
              width="180"
              height="180"
              style="object-fit: cover"
            />

            <img
              th:unless="${student.photo != null}"
              th:src="@{/images/default-user.png}"
              class="rounded-circle border shadow"
              width="180"
              height="180"
              style="object-fit: cover"
            />

            <table class="table table-bordered">
              <tr>
                <th width="30%">Student ID</th>
                <td th:text="${student.id}"></td>
              </tr>

              <tr>
                <th>First Name</th>
                <td th:text="${student.firstName}"></td>
              </tr>

              <tr>
                <th>Last Name</th>
                <td th:text="${student.lastName}"></td>
              </tr>

              <tr>
                <th>Email</th>
                <td th:text="${student.email}"></td>
              </tr>

              <tr>
                <th>Phone</th>
                <td th:text="${student.phone}"></td>
              </tr>

              <tr>
                <th>Gender</th>
                <td th:text="${student.gender}"></td>
              </tr>

              <tr>
                <th>Course</th>
                <td th:text="${student.course}"></td>
              </tr>

              <tr>
                <th>Date of Birth</th>
                <td th:text="${student.dateOfBirth}"></td>
              </tr>

              <tr>
                <th>Address</th>
                <td th:text="${student.address}"></td>
              </tr>
            </table>
            <div class="text-center mt-4">
              <a th:href="@{/student}" class="btn btn-secondary me-2"> Back </a>

              <a
                th:href="@{/student/edit/{id}(id=${student.id})}"
                class="btn btn-warning"
              >
                Edit Student
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
