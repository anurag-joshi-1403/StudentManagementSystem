<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Student Profile</title>

  </head>

  <body>
    <div class="container mt-5" th:fragment="content">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3 class="text-center">Student Profile</h3>
        </div>

        <div class="card-body">
          <div class="text-center mb-4">
            <img
              th:if="${student.photo != null}"
              th:src="@{'/student-images/' + ${student.photo}}"
              class="rounded-circle border shadow"
              width="180"
              height="180"
              style="object-fit: cover"
            />

            <img
              th:unless="${student.photo != null}"
              th:src="@{/images/default-avatar.svg}"
              class="rounded-circle border shadow"
              width="180"
              height="180"
              style="object-fit: cover"
              alt="No photo"
            />

            <table class="table table-bordered">
              <tr>
                <th width="30%">Student ID</th>
                <td th:text="${student.id}"></td>
              </tr>

              <tr>
                <th>First Name</th>
                <td th:text="${student.firstName}"></td>
              </tr>

              <tr>
                <th>Last Name</th>
                <td th:text="${student.lastName}"></td>
              </tr>

              <tr>
                <th>Email</th>
                <td th:text="${student.email}"></td>
              </tr>

              <tr>
                <th>Phone</th>
                <td th:text="${student.phone}"></td>
              </tr>

              <tr>
                <th>Gender</th>
                <td th:text="${student.gender}"></td>
              </tr>

              <tr>
                <th>Course</th>
                <td th:text="${student.course}"></td>
              </tr>

              <tr>
                <th>Date of Birth</th>
                <td th:text="${student.dateOfBirth}"></td>
              </tr>

              <tr>
                <th>Address</th>
                <td th:text="${student.address}"></td>
              </tr>

              <tr>
                <th>Attendance</th>
                <td>
                  <th:block th:if="${attendance.hasRecords()}">
                    <span
                      th:class="${attendance.belowMinimum} ? 'fw-semibold text-danger' : 'fw-semibold'"
                      th:text="${#numbers.formatDecimal(attendance.percentage, 1, 0)} + '%'"
                    >0%</span>
                    <span class="text-muted" th:text="'(' + ${attendance.present} + '/' + ${attendance.total} + ' present)'"></span>
                    <span th:if="${attendance.belowMinimum}" class="badge bg-danger ms-1">Below 75%</span>
                  </th:block>
                  <span th:unless="${attendance.hasRecords()}" class="text-muted">No attendance recorded yet</span>
                </td>
              </tr>
            </table>
            <div class="text-center mt-4">
              <a th:href="@{/student}" class="btn btn-secondary me-2"> Back </a>

              <a
                th:href="@{/student/{id}/marksheet(id=${student.id})}"
                class="btn btn-primary me-2"
              >
                <i class="bi bi-file-earmark-text me-1"></i>Marksheet
              </a>

              <a
                th:href="@{/student/edit/{id}(id=${student.id})}"
                sec:authorize="hasRole('ADMIN')"
                class="btn btn-warning"
              >
                Edit Student
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
