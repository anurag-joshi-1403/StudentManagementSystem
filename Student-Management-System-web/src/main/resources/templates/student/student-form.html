<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="card-body">
      <form th:action="@{/student}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}" />
        <!-- First Name -->
        <div class="mb-3">
          <label class="form-label">First Name</label>
          <input
            type="text"
            th:field="*{firstName}"
            class="form-control"
            th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('firstName')}"
            th:errors="*{firstName}"
          ></div>
        </div>
        <!-- Last Name -->
        <div class="mb-3">
          <label class="form-label"> Last Name </label>
          <input
            type="text"
            th:field="*{lastName}"
            class="form-control"
            th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('lastName')}"
            th:errors="*{lastName}"
          ></div>
        </div>
        <!-- Email -->
        <div class="mb-3">
          <label class="form-label"> Email </label>
          <input
            type="text"
            th:field="*{email}"
            class="form-control"
            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
          />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
          ></div>
        </div>
        <!-- Phone -->
        <div class="mb-3">
          <label class="form-label"> Phone </label>
          <input type="text" class="form-control" th:field="*{phone}" />
        </div>
        <!-- Gender -->
        <div class="mb-3">
          <label class="form-label"> Gender </label>

          <select class="form-select" th:field="*{gender}">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('gender')}"
            th:errors="*{gender}"
          ></div>
        </div>
        <!-- Course -->
        <div class="mb-3">
          <label class="form-label">Course</label>
          <input type="text" class="form-control" th:field="*{course}" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('course')}"
            th:errors="*{course}"
          ></div>
        </div>
        <!-- Date of Birth -->
        <div class="mb-3">
          <label class="form-label">Date of Birth</label>
          <input type="date" class="form-control" th:field="*{dateOfBirth}" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('dateOfBirth')}"
            th:errors="*{dateOfBirth}"
          ></div>
        </div>
        <!-- Address -->
        <div class="mb-3">
          <label class="form-label"> Address </label>
          <textarea class="form-control" th:field="*{address}"></textarea>
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('address')}"
            th:errors="*{address}"
          ></div>
        </div>
        <!-- Add Photo -->
        <div class="mb-3">
          <label class="form-label">Photo</label>
          <input type="file"/>
        </div>
        <!-- Add Buttons -->
        <button type="submit" class="btn btn-success">Save Student</button>
        <a th:href="@{/student}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </body>
</html>
