<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${student.id == null ? 'Add Student' : 'Edit Student'} + ' | Student Management System'">Student Form</title>
  </head>
  <body class="bg-light">
    <div class="container my-5" th:fragment="content">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
              <h3 class="mb-0 text-center">
                <i class="bi bi-person-plus-fill me-2" th:if="${student.id == null}"></i>
                <i class="bi bi-pencil-square me-2" th:if="${student.id != null}"></i>
                <span th:text="${student.id == null ? 'Add New Student' : 'Edit Student Details'}">Student Form</span>
              </h3>
            </div>

            <div class="card-body p-4">
              <form
                th:action="@{/student}"
                th:object="${student}"
                method="post"
                enctype="multipart/form-data"
              >
                <!-- Hidden ID -->
                <input type="hidden" th:field="*{id}" />

                <!-- Name Row -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
                    <input
                      type="text"
                      th:field="*{firstName}"
                      class="form-control"
                      placeholder="Enter first name"
                      th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                    />
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}"
                    ></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
                    <input
                      type="text"
                      th:field="*{lastName}"
                      class="form-control"
                      placeholder="Enter last name"
                      th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                    />
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}"
                    ></div>
                  </div>
                </div>

                <!-- Email & Phone Row -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                    <input
                      type="email"
                      th:field="*{email}"
                      class="form-control"
                      placeholder="student@example.com"
                      th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                    />
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"
                    ></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Phone (10 digits) <span class="text-danger">*</span></label>
                    <input
                      type="text"
                      th:field="*{phone}"
                      class="form-control"
                      placeholder="e.g. 9876543210"
                      maxlength="10"
                      th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                    />
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}"
                    ></div>
                  </div>
                </div>

                <!-- Gender & Course Row -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Gender <span class="text-danger">*</span></label>
                    <select
                      class="form-select"
                      th:field="*{gender}"
                      th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'"
                    >
                      <option value="">-- Select Gender --</option>
                      <option value="Male">Male</option>
                      <option value="Female">Female</option>
                      <option value="Other">Other</option>
                    </select>
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('gender')}"
                      th:errors="*{gender}"
                    ></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Course <span class="text-danger">*</span></label>
                    <!-- If courses exist from DB, show select dropdown -->
                    <div th:if="${courses != null and !courses.isEmpty()}">
                      <select
                        class="form-select"
                        th:field="*{course}"
                        th:classappend="${#fields.hasErrors('course')} ? 'is-invalid'"
                      >
                        <option value="">-- Select Course --</option>
                        <option
                          th:each="c : ${courses}"
                          th:value="${c.courseName}"
                          th:text="${c.courseName + ' (' + c.courseCode + ')'}"
                        ></option>
                      </select>
                    </div>
                    <!-- Fallback text input if no courses are in database yet -->
                    <div th:unless="${courses != null and !courses.isEmpty()}">
                      <input
                        type="text"
                        class="form-control"
                        th:field="*{course}"
                        placeholder="Enter course name"
                        th:classappend="${#fields.hasErrors('course')} ? 'is-invalid'"
                      />
                    </div>
                    <div
                      class="invalid-feedback d-block"
                      th:if="${#fields.hasErrors('course')}"
                      th:errors="*{course}"
                    ></div>
                  </div>
                </div>

                <!-- Date of Birth & Photo Row -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Date of Birth <span class="text-danger">*</span></label>
                    <input
                      type="date"
                      class="form-control"
                      th:field="*{dateOfBirth}"
                      th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'"
                    />
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('dateOfBirth')}"
                      th:errors="*{dateOfBirth}"
                    ></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Student Photo</label>
                    <input
                      type="file"
                      class="form-control"
                      name="photoFile"
                      accept="image/jpeg,image/png"
                      th:classappend="${#fields.hasErrors('photo')} ? 'is-invalid'"
                    />
                    <small class="text-muted d-block mt-1">JPG or PNG, up to 2 MB</small>
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('photo')}"
                      th:errors="*{photo}"
                    ></div>

                    <!-- Preview existing photo if editing -->
                    <div th:if="${student.photo != null}" class="mt-2 d-flex align-items-center gap-2">
                      <img
                        th:src="@{'/student-images/' + ${student.photo}}"
                        alt="Current Photo"
                        width="50"
                        height="50"
                        class="rounded-circle border"
                        style="object-fit: cover"
                      />
                      <small class="text-secondary">Current: <span th:text="${student.photo}"></span></small>
                    </div>
                  </div>
                </div>

                <!-- Address -->
                <div class="mb-4">
                  <label class="form-label fw-semibold">Address <span class="text-danger">*</span></label>
                  <textarea
                    class="form-control"
                    rows="3"
                    th:field="*{address}"
                    placeholder="Enter full address"
                    th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"
                  ></textarea>
                  <div
                    class="invalid-feedback"
                    th:if="${#fields.hasErrors('address')}"
                    th:errors="*{address}"
                  ></div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                  <a th:href="@{/student}" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancel
                  </a>
                  <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-check-circle me-1"></i>Save Student
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
