<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Teacher Details</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f5f5;
      }

      .teacher-photo {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid #0d6efd;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>

  <body>
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h2 class="text-center">Teacher Details</h2>
        </div>

        <div class="card-body">
          <!-- Teacher Photo -->

          <div class="text-center mb-4">
            <img
              th:if="${teacher.photo != null}"
              th:src="@{/teacher-images/{file}(file=${teacher.photo})}"
              class="teacher-photo"
              alt="Teacher Photo"
            />

            <img
              th:if="${teacher.photo == null}"
              src="https://via.placeholder.com/180x180.png?text=No+Photo"
              class="teacher-photo"
              alt="No Photo"
            />
          </div>

          <table class="table table-bordered table-striped">
            <tr>
              <th width="30%">Teacher ID</th>

              <td th:text="${teacher.id}"></td>
            </tr>

            <tr>
              <th>First Name</th>

              <td th:text="${teacher.firstName}"></td>
            </tr>

            <tr>
              <th>Last Name</th>

              <td th:text="${teacher.lastName}"></td>
            </tr>

            <tr>
              <th>Email</th>

              <td th:text="${teacher.email}"></td>
            </tr>

            <tr>
              <th>Phone Number</th>

              <td th:text="${teacher.phone}"></td>
            </tr>

            <tr>
              <th>Gender</th>

              <td th:text="${teacher.gender}"></td>
            </tr>

            <tr>
              <th>Department</th>

              <td th:text="${teacher.department}"></td>
            </tr>

            <tr>
              <th>Qualification</th>

              <td th:text="${teacher.qualification}"></td>
            </tr>
          </table>

          <div class="text-center mt-4">
            <a th:href="@{/teacher}" class="btn btn-secondary"> Back </a>

            <a
              th:href="@{/teacher/edit/{id}(id=${teacher.id})}"
              class="btn btn-warning"
            >
              Edit Teacher
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
