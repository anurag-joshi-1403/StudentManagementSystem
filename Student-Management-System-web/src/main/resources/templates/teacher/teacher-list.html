<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Teacher Management System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <h2 class="text-center mb-4">Teacher Management System</h2>

      <div class="card shadow">
        <div class="card-body">
          <div class="d-flex justify-content-between mb-3">
            <h4>Teacher List</h4>

            <a th:href="@{/teacher/new}" class="btn btn-primary">
              Add Teacher
            </a>
          </div>

          <table class="table table-bordered table-hover">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="teacher : ${teachers}">
                <td th:text="${teacher.id}"></td>

                <td
                  th:text="${teacher.firstName + ' ' + teacher.lastName}"
                ></td>

                <td th:text="${teacher.email}"></td>

                <td th:text="${teacher.department}"></td>

                <td>
                  <a
                    th:href="@{/teacher/edit/{id}(id=${teacher.id})}"
                    class="btn btn-warning btn-sm"
                  >
                    Edit
                  </a>
                  <button class="btn btn-danger btn-sm" disabled>Delete</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
