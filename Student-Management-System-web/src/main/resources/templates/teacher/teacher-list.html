<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <title>Teacher Management System</title>

  </head>

  <body>
    <div class="container mt-5" th:fragment="content">
      <h2 class="text-center mb-4">Teacher Management System</h2>

      <div class="card shadow">
        <div class="card-body">
          <div class="row align-items-center mb-3">
            <!-- Left Side -->
            <div class="col-md-3">
              <h4 class="mb-0">Teacher List</h4>
            </div>

            <!-- Right Side -->
            <div class="col-md-9">
              <div class="d-flex justify-content-end">
                <!-- Search Form -->
                <form th:action="@{/teacher}" method="get" class="d-flex me-2">
                  <input
                    type="text"
                    name="keyword"
                    class="form-control"
                    style="width: 250px"
                    placeholder="Search by name, email or department"
                    th:value="${keyword}"
                  />

                  <button type="submit" class="btn btn-success ms-2">
                    Search
                  </button>
                </form>

                <!-- Add Teacher Button -->
                <a th:href="@{/teacher/new}" sec:authorize="hasRole('ADMIN')" class="btn btn-primary">
                  Add Teacher
                </a>
              </div>
            </div>
          </div>
          <table class="table table-bordered table-hover">
            <thead class="table-dark">
              <tr>
                <th>Photo</th>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="teacher : ${teachers}">
                <td>
                  <img
                    th:if="${teacher.photo != null}"
                    th:src="@{/teacher-images/{file}(file=${teacher.photo})}"
                    width="60"
                    height="60"
                    style="
                      border-radius: 50%;
                      object-fit: cover;
                      border: 2px solid #0d6efd;
                    "
                  />
                  <img
                    th:if="${teacher.photo == null}"
                    th:src="@{/images/default-avatar.svg}"
                    alt="No photo"
                    width="60"
                    height="60"
                    style="border-radius: 50%"
                  />
                </td>
                <td th:text="${teacher.id}"></td>

                <td
                  th:text="${teacher.firstName + ' ' + teacher.lastName}"
                ></td>

                <td th:text="${teacher.email}"></td>

                <td th:text="${teacher.department}"></td>

                <td>
                  <a
                    th:href="@{/teacher/view/{id}(id=${teacher.id})}"
                    class="btn btn-info btn-sm mb-1"
                    >View</a
                  >

                  <a
                    th:href="@{/teacher/edit/{id}(id=${teacher.id})}"
                    sec:authorize="hasRole('ADMIN')"
                    class="btn btn-warning btn-sm"
                  >
                    Edit
                  </a>
                  <!--/* POST, not a link: a GET delete could be triggered by link
                       prefetch or a crawler, and CSRF protection does not cover GET.
                       th:action adds the CSRF token. */-->
                  <form
                    th:action="@{/teacher/delete/{id}(id=${teacher.id})}"
                    sec:authorize="hasRole('ADMIN')"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('Are you sure you want to delete this teacher?');"
                  >
                    <button type="submit" class="btn btn-danger btn-sm">
                      Delete
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
          <nav th:if="${totalPages > 1}" class="mt-3">
            <ul class="pagination justify-content-center">
              <!-- Previous -->
              <li
                class="page-item"
                th:classappend="${currentPage == 1} ? 'disabled'"
              >
                <a
                  class="page-link"
                  th:href="@{/teacher(keyword=${keyword}, page=${currentPage-1})}"
                >
                  Previous
                </a>
              </li>

              <!-- Page Numbers -->
              <li
                class="page-item"
                th:each="i : ${#numbers.sequence(1,totalPages)}"
                th:classappend="${currentPage == i} ? 'active'"
              >
                <a
                  class="page-link"
                  th:href="@{/teacher(keyword=${keyword}, page=${i})}"
                  th:text="${i}"
                >
                </a>
              </li>

              <!-- Next -->
              <li
                class="page-item"
                th:classappend="${currentPage == totalPages} ? 'disabled'"
              >
                <a
                  class="page-link"
                  th:href="@{/teacher(keyword=${keyword}, page=${currentPage+1})}"
                >
                  Next
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </body>
</html>
