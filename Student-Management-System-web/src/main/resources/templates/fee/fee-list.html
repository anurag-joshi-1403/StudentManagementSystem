<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fee Management | Student Management System</title>
  </head>

  <body class="bg-light">
    <div class="container my-5" th:fragment="content">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
          <h3 class="mb-0"><i class="bi bi-cash-coin me-2"></i>Fee Management</h3>
          <div class="d-flex gap-2">
            <a th:href="@{/fee/export}" class="btn btn-outline-light fw-semibold">
              <i class="bi bi-download me-1"></i>Export CSV
            </a>
            <a th:href="@{/fee/new}" class="btn btn-light text-primary fw-semibold">
              <i class="bi bi-plus-circle me-1"></i>Collect Fee
            </a>
          </div>
        </div>

        <div class="card-body p-4">
          <!-- Search Bar -->
          <form th:action="@{/fee/search}" method="get" class="mb-4">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input
                type="text"
                name="keyword"
                class="form-control"
                placeholder="Search by student name, fee type, or payment status..."
                th:value="${keyword}"
              />
              <button class="btn btn-primary px-4" type="submit">Search</button>
              <a th:href="@{/fee}" class="btn btn-outline-secondary px-3" th:if="${keyword != null and !keyword.isEmpty()}">
                <i class="bi bi-x-circle me-1"></i>Reset
              </a>
            </div>
          </form>

          <!-- Fee Table -->
          <div class="table-responsive">
            <table class="table table-hover table-bordered align-middle">
              <thead class="table-dark">
                <tr>
                  <th width="60">ID</th>
                  <th>Student</th>
                  <th>Fee Type</th>
                  <th>Amount</th>
                  <th>Due Date</th>
                  <th>Payment Date</th>
                  <th>Status</th>
                  <th>Method</th>
                  <th width="150" class="text-center">Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="fee : ${fees}">
                  <td class="text-muted" th:text="${fee.id}"></td>
                  <td class="fw-semibold" th:text="${fee.student.firstName + ' ' + fee.student.lastName}"></td>
                  <td th:text="${fee.feeType}"></td>
                  <td class="fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(fee.amount, 1, 2)}"></td>
                  <td>
                    <span th:text="${fee.dueDate}"></span>
                    <span th:if="${fee.overdue}" class="badge bg-danger ms-1" title="Not paid and past the due date">
                      <i class="bi bi-exclamation-triangle me-1"></i>Overdue
                    </span>
                  </td>
                  <td th:text="${fee.paymentDate != null ? fee.paymentDate : '-'}"></td>
                  <td>
                    <span th:if="${fee.paymentStatus == 'Paid'}" class="badge bg-success">
                      <i class="bi bi-check-circle me-1"></i>Paid
                    </span>
                    <span th:if="${fee.paymentStatus == 'Pending'}" class="badge bg-warning text-dark">
                      <i class="bi bi-clock-history me-1"></i>Pending
                    </span>
                    <span th:if="${fee.paymentStatus != 'Paid' and fee.paymentStatus != 'Pending'}" class="badge bg-secondary" th:text="${fee.paymentStatus}"></span>
                  </td>
                  <td th:text="${fee.paymentMethod != null and !fee.paymentMethod.isEmpty() ? fee.paymentMethod : '-'}"></td>
                  <td class="text-center">
                    <a
                      th:href="@{/fee/view/{id}(id=${fee.id})}"
                      class="btn btn-info btn-sm text-white me-1"
                      title="View Fee Record"
                    >
                      <i class="bi bi-eye"></i>
                    </a>
                    <a
                      th:href="@{/fee/edit/{id}(id=${fee.id})}"
                      class="btn btn-warning btn-sm me-1"
                      title="Edit Fee Record"
                    >
                      <i class="bi bi-pencil-square"></i>
                    </a>
                    <!--/* POST, not a link: a GET delete could be triggered by link
                         prefetch or a crawler, and CSRF protection does not cover GET.
                         th:action adds the CSRF token. */-->
                    <form
                      th:action="@{/fee/delete/{id}(id=${fee.id})}"
                      method="post"
                      class="d-inline"
                      onsubmit="return confirm('Are you sure you want to delete this fee record?');"
                    >
                      <button type="submit" class="btn btn-danger btn-sm" title="Delete Fee Record">
                        <i class="bi bi-trash"></i>
                      </button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(fees)}">
                  <td colspan="9" class="text-center text-muted py-4">
                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                    No fee records found.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Total Counter -->
          <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
            <span class="text-muted">
              Total Records: <strong class="text-dark" th:text="${totalItems != null ? totalItems : totalFees}">0</strong>
            </span>

            <!-- Pagination -->
            <nav th:if="${totalPages != null and totalPages > 1}">
              <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                  <a class="page-link" th:href="@{/fee(page=${currentPage - 1}, keyword=${keyword})}">
                    <i class="bi bi-chevron-left"></i> Previous
                  </a>
                </li>
                <li
                  class="page-item"
                  th:each="i : ${#numbers.sequence(1, totalPages)}"
                  th:classappend="${currentPage == i} ? 'active'"
                >
                  <a class="page-link" th:href="@{/fee(page=${i}, keyword=${keyword})}" th:text="${i}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                  <a class="page-link" th:href="@{/fee(page=${currentPage + 1}, keyword=${keyword})}">
                    Next <i class="bi bi-chevron-right"></i>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
