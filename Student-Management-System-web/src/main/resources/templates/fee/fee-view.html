<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fee Receipt</title>
  </head>

  <body>
    <!--/* Every /fee page is admin-only (C9), so nothing here needs sec:authorize.
         Printing hides the sidebar, navbar and footer (theme.css @media print)
         and the buttons (.d-print-none), so only the receipt goes on paper. */-->
    <div class="container mt-5" th:fragment="content">
      <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h3 class="mb-0">
            <i class="bi bi-receipt me-2"></i>
            <span th:text="${fee.paymentStatus == 'Paid'} ? 'Fee Receipt' : 'Fee Statement'">Fee Receipt</span>
          </h3>
          <span class="badge bg-light text-primary fs-6" th:text="'No. FEE-' + ${#numbers.formatInteger(fee.id, 5)}">No.</span>
        </div>

        <div class="card-body p-4">
          <!-- Institution and receipt facts -->
          <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
            <h4 class="mb-0 fw-bold" th:text="${institutionName}">Institution</h4>
            <div class="text-end">
              <div>
                <span class="text-muted" th:text="${fee.paymentStatus == 'Paid'} ? 'Receipt No.' : 'Statement No.'">Receipt No.</span>
                <strong th:text="'FEE-' + ${#numbers.formatInteger(fee.id, 5)}"></strong>
              </div>
              <div><span class="text-muted">Issued on</span> <strong th:text="${issuedOn}"></strong></div>
            </div>
          </div>

          <table class="table table-bordered mb-4">
            <tbody>
              <tr>
                <th width="30%"><i class="bi bi-person me-2 text-muted"></i>Student</th>
                <td>
                  <a
                    class="text-decoration-none"
                    th:href="@{/student/view/{id}(id=${fee.student.id})}"
                    th:text="${fee.student.firstName + ' ' + fee.student.lastName}"
                  >Student</a>
                  <span class="text-muted ms-2" th:text="'(Student ID ' + ${fee.student.id} + ')'"></span>
                </td>
              </tr>
              <tr>
                <th><i class="bi bi-book-half me-2 text-muted"></i>Course</th>
                <td th:text="${fee.student.course}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-tag me-2 text-muted"></i>Fee Type</th>
                <td th:text="${fee.feeType}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-calendar-event me-2 text-muted"></i>Due Date</th>
                <td>
                  <span th:text="${fee.dueDate}"></span>
                  <span th:if="${fee.overdue}" class="badge bg-danger ms-2">
                    <i class="bi bi-exclamation-triangle me-1"></i>Overdue
                  </span>
                </td>
              </tr>
              <tr>
                <th><i class="bi bi-calendar-check me-2 text-muted"></i>Payment Date</th>
                <td th:text="${fee.paymentDate != null ? fee.paymentDate : 'Not paid yet'}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-credit-card me-2 text-muted"></i>Payment Method</th>
                <td th:text="${fee.paymentMethod != null and !fee.paymentMethod.isEmpty() ? fee.paymentMethod : '-'}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-flag me-2 text-muted"></i>Status</th>
                <td>
                  <span th:if="${fee.paymentStatus == 'Paid'}" class="badge bg-success">
                    <i class="bi bi-check-circle me-1"></i>Paid
                  </span>
                  <span th:if="${fee.paymentStatus == 'Pending'}" class="badge bg-warning text-dark">
                    <i class="bi bi-clock-history me-1"></i>Pending
                  </span>
                  <span
                    th:if="${fee.paymentStatus != 'Paid' and fee.paymentStatus != 'Pending'}"
                    class="badge bg-secondary"
                    th:text="${fee.paymentStatus}"
                  ></span>
                </td>
              </tr>
            </tbody>
          </table>

          <!-- Amount -->
          <div class="d-flex justify-content-between align-items-center border-top border-bottom py-3 mb-4">
            <span class="fs-5 fw-semibold" th:text="${fee.paymentStatus == 'Paid'} ? 'Amount Paid' : 'Amount Due'">Amount</span>
            <span class="fs-3 fw-bold" th:text="'₹' + ${#numbers.formatDecimal(fee.amount, 1, 'COMMA', 2, 'POINT')}">₹0.00</span>
          </div>

          <p class="text-muted small mb-0">
            This is a computer-generated document and needs no signature.
          </p>

          <div class="text-center mt-4 d-print-none">
            <a th:href="@{/fee}" class="btn btn-secondary me-2">
              <i class="bi bi-arrow-left me-1"></i>Back to Fees
            </a>
            <button type="button" class="btn btn-primary me-2" onclick="window.print()">
              <i class="bi bi-printer me-1"></i>Print
            </button>
            <a th:href="@{/fee/{id}/receipt.pdf(id=${fee.id})}" class="btn btn-outline-primary me-2">
              <i class="bi bi-file-earmark-pdf me-1"></i>Download PDF
            </a>
            <a th:href="@{/fee/edit/{id}(id=${fee.id})}" class="btn btn-warning">
              <i class="bi bi-pencil-square me-1"></i>Edit Fee
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
