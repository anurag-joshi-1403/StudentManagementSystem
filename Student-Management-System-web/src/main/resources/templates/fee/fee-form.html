<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Fee Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3>Fee Form</h3>
        </div>

        <div class="card-body">
          <form
            th:action="${fee.id == null} ? @{/fee/save} : @{/fee/update/{id}(id=${fee.id})}"
            th:object="${fee}"
            method="post"
          >
            <!-- Student -->

            <div class="mb-3">
              <label class="form-label">Student</label>

              <select class="form-select" th:field="*{student}" required>
                <option value="">Select Student</option>

                <option
                  th:each="student : ${students}"
                  th:value="${student.id}"
                  th:text="${student.firstName + ' ' + student.lastName}"
                ></option>
              </select>
            </div>

            <!-- Fee Type -->

            <div class="mb-3">
              <label class="form-label">Fee Type</label>

              <select class="form-select" th:field="*{feeType}" required>
                <option value="">Select Fee Type</option>
                <option value="Tuition">Tuition</option>
                <option value="Library">Library</option>
                <option value="Hostel">Hostel</option>
                <option value="Transport">Transport</option>
                <option value="Examination">Examination</option>
                <option value="Miscellaneous">Miscellaneous</option>
              </select>
            </div>

            <!-- Amount -->

            <div class="mb-3">
              <label class="form-label">Amount</label>

              <input
                type="number"
                step="0.01"
                class="form-control"
                th:field="*{amount}"
                placeholder="Enter Amount"
                required
              />
            </div>

            <!-- Due Date -->

            <div class="mb-3">
              <label class="form-label">Due Date</label>

              <input
                type="date"
                class="form-control"
                th:field="*{dueDate}"
                required
              />
            </div>

            <!-- Payment Date -->

            <div class="mb-3">
              <label class="form-label">Payment Date</label>

              <input
                type="date"
                class="form-control"
                th:field="*{paymentDate}"
              />
            </div>

            <!-- Payment Status -->

            <div class="mb-3">
              <label class="form-label">Payment Status</label>

              <select class="form-select" th:field="*{paymentStatus}" required>
                <option value="">Select Status</option>
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
              </select>
            </div>

            <!-- Payment Method -->

            <div class="mb-3">
              <label class="form-label">Payment Method</label>

              <select class="form-select" th:field="*{paymentMethod}">
                <option value="">Select Payment Method</option>
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Bank Transfer">Bank Transfer</option>
              </select>
            </div>

            <!-- Buttons -->

            <div class="d-flex justify-content-between">
              <a th:href="@{/fee}" class="btn btn-secondary"> Back </a>

              <button type="submit" class="btn btn-success">Save Fee</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
