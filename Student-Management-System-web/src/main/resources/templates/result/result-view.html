<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Result Details</title>
  </head>

  <body>
    <div class="container mt-5" th:fragment="content">
      <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h3 class="mb-0"><i class="bi bi-clipboard-data me-2"></i>Result Details</h3>
          <span
            th:class="${result.resultStatus == 'Pass'} ? 'badge bg-success fs-6' : 'badge bg-danger fs-6'"
            th:text="${result.resultStatus}"
          >Status</span>
        </div>

        <div class="card-body">
          <table class="table table-bordered table-striped mt-3">
            <tbody>
              <tr>
                <th width="30%"><i class="bi bi-hash me-2 text-muted"></i>Result ID</th>
                <td th:text="${result.id}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-person me-2 text-muted"></i>Student</th>
                <td>
                  <a
                    th:href="@{/student/view/{id}(id=${result.student.id})}"
                    th:text="${result.student.firstName + ' ' + result.student.lastName}"
                  >Student</a>
                </td>
              </tr>
              <tr>
                <th><i class="bi bi-pencil-square me-2 text-muted"></i>Exam</th>
                <td>
                  <a th:href="@{/exam/view/{id}(id=${result.exam.id})}" th:text="${result.exam.examName}">Exam</a>
                  <span class="text-muted ms-2" th:text="'(' + ${result.exam.examDate} + ')'"></span>
                </td>
              </tr>
              <tr>
                <th><i class="bi bi-journal-bookmark me-2 text-muted"></i>Subject</th>
                <td>
                  <a
                    th:href="@{/subject/view/{id}(id=${result.exam.subject.id})}"
                    th:text="${result.exam.subject.subjectName}"
                  >Subject</a>
                </td>
              </tr>
              <tr>
                <th><i class="bi bi-123 me-2 text-muted"></i>Marks</th>
                <td class="fw-bold" th:text="${result.obtainedMarks} + ' / ' + ${result.exam.totalMarks}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-percent me-2 text-muted"></i>Percentage</th>
                <td th:text="${#numbers.formatDecimal(result.obtainedMarks * 100.0 / result.exam.totalMarks, 1, 1)} + '%'"></td>
              </tr>
              <tr>
                <th><i class="bi bi-check2-circle me-2 text-muted"></i>Passing Marks</th>
                <td th:text="${result.exam.passingMarks}"></td>
              </tr>
              <tr>
                <th><i class="bi bi-award me-2 text-muted"></i>Grade</th>
                <td><span class="badge bg-primary fs-6" th:text="${result.grade}"></span></td>
              </tr>
              <tr>
                <th><i class="bi bi-flag me-2 text-muted"></i>Status</th>
                <td>
                  <span
                    th:class="${result.resultStatus == 'Pass'} ? 'badge bg-success' : 'badge bg-danger'"
                    th:text="${result.resultStatus}"
                  ></span>
                </td>
              </tr>
            </tbody>
          </table>

          <div class="text-center mt-4">
            <a th:href="@{/result}" class="btn btn-secondary me-2">
              <i class="bi bi-arrow-left me-1"></i>Back to Results
            </a>
            <a th:href="@{/result/edit/{id}(id=${result.id})}" sec:authorize="hasAnyRole('ADMIN', 'TEACHER')" class="btn btn-warning">
              <i class="bi bi-pencil-square me-1"></i>Edit Result
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
