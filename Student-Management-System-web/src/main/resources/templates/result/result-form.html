<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Result Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3
            class="mb-0"
            th:text="${result.id == null ? 'Add Result' : 'Update Result'}"
          ></h3>
        </div>

        <div class="card-body">
          <form
            th:action="${result.id == null} ?
                    @{/result/save} :
                    @{/result/update/{id}(id=${result.id})}"
            th:object="${result}"
            method="post"
          >
            <!-- Student -->

            <div class="mb-3">
              <label class="form-label"> Student </label>

              <select class="form-select" th:field="*{student}" required>
                <option value="">Select Student</option>

                <option
                  th:each="student : ${students}"
                  th:value="${student.id}"
                  th:text="${student.firstName + ' ' + student.lastName}"
                ></option>
              </select>
            </div>

            <!-- Exam -->

            <div class="mb-3">
              <label class="form-label"> Exam </label>

              <select class="form-select" th:field="*{exam}" required>
                <option value="">Select Exam</option>

                <option
                  th:each="exam : ${exams}"
                  th:value="${exam.id}"
                  th:text="${exam.examName}"
                ></option>
              </select>
            </div>

            <!-- Obtained Marks -->

            <div class="mb-3">
              <label class="form-label"> Obtained Marks </label>

              <input
                type="number"
                class="form-control"
                th:field="*{obtainedMarks}"
                min="0"
                placeholder="Enter Obtained Marks"
                required
              />
            </div>

            <!-- Grade -->

            <div class="mb-3">
              <label class="form-label"> Grade </label>

              <input
                type="text"
                class="form-control"
                th:field="*{grade}"
                readonly
              />

              <small class="text-muted">
                Grade will be calculated automatically.
              </small>
            </div>

            <!-- Result Status -->

            <div class="mb-3">
              <label class="form-label"> Result Status </label>

              <input
                type="text"
                class="form-control"
                th:field="*{resultStatus}"
                readonly
              />

              <small class="text-muted">
                Pass / Fail will be calculated automatically.
              </small>
            </div>

            <!-- Buttons -->

            <div class="d-flex justify-content-between">
              <a th:href="@{/result}" class="btn btn-secondary"> Back </a>

              <button type="submit" class="btn btn-success">
                <span
                  th:text="${result.id == null ? 'Save Result' : 'Update Result'}"
                ></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
