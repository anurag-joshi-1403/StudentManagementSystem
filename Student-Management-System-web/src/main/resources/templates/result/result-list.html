<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Result Management</title>

  </head>

  <body>
    <div class="container mt-4" th:fragment="content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Result Management</h2>

        <a th:href="@{/result/new}" class="btn btn-primary"> + Add Result </a>
      </div>

      <!-- Search -->

      <form th:action="@{/result/search}" method="get" class="row g-3 mb-4">
        <div class="col-md-10">
          <input
            type="text"
            name="keyword"
            class="form-control"
            placeholder="Search by Student, Exam, Grade or Status"
          />
        </div>

        <div class="col-md-1">
          <button class="btn btn-success w-100">Search</button>
        </div>

        <div class="col-md-1">
          <a th:href="@{/result}" class="btn btn-secondary w-100"> Reset </a>
        </div>
      </form>

      <!-- Result Table -->

      <table class="table table-bordered table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Exam</th>
            <th>Subject</th>
            <th>Obtained Marks</th>
            <th>Grade</th>
            <th>Status</th>
            <th width="170">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="result : ${resultList}">
            <td th:text="${result.id}"></td>

            <td
              th:text="${result.student.firstName + ' ' + result.student.lastName}"
            ></td>

            <td th:text="${result.exam.examName}"></td>

            <td th:text="${result.exam.subject.subjectName}"></td>

            <td th:text="${result.obtainedMarks}"></td>

            <td>
              <span class="badge bg-primary" th:text="${result.grade}"> </span>
            </td>

            <td>
              <span
                th:class="${result.resultStatus == 'Pass'} ?
                        'badge bg-success' :
                        'badge bg-danger'"
                th:text="${result.resultStatus}"
              >
              </span>
            </td>

            <td>
              <a
                th:href="@{/result/edit/{id}(id=${result.id})}"
                class="btn btn-warning btn-sm"
              >
                Edit
              </a>

              <a
                th:href="@{/result/delete/{id}(id=${result.id})}"
                class="btn btn-danger btn-sm"
                onclick="return confirm('Delete this result?');"
              >
                Delete
              </a>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination -->

      <nav th:if="${totalPages != null && totalPages > 1}">
        <ul class="pagination justify-content-center">
          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(1,totalPages)}"
          >
            <a
              class="page-link"
              th:href="@{/result/page/{page}(page=${i})}"
              th:text="${i}"
            >
            </a>
          </li>
        </ul>
      </nav>
    </div>

  </body>
</html>
