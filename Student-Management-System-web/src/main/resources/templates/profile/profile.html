<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Profile</title>
  </head>

  <body>
    <div class="container mt-5" th:fragment="content">
      <div class="row g-4">
        <!-- Account (F9) -->
        <div class="col-lg-6">
          <div class="card shadow h-100">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
              <h3 class="mb-0"><i class="bi bi-person-circle me-2"></i>My Profile</h3>
              <span class="badge bg-light text-primary fs-6" th:text="${#strings.replace(account.role, 'ROLE_', '')}">ROLE</span>
            </div>
            <div class="card-body">
              <table class="table table-bordered table-striped mt-2 mb-0">
                <tbody>
                  <tr>
                    <th width="40%"><i class="bi bi-person me-2 text-muted"></i>Full Name</th>
                    <td th:text="${account.fullName}"></td>
                  </tr>
                  <tr>
                    <th><i class="bi bi-at me-2 text-muted"></i>Username</th>
                    <td th:text="${account.username}"></td>
                  </tr>
                  <tr>
                    <th><i class="bi bi-envelope me-2 text-muted"></i>Email</th>
                    <td th:text="${account.email}"></td>
                  </tr>
                  <tr>
                    <th><i class="bi bi-shield-lock me-2 text-muted"></i>Role</th>
                    <td th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(account.role, 'ROLE_', '')))}"></td>
                  </tr>
                  <tr>
                    <th><i class="bi bi-calendar-check me-2 text-muted"></i>Member Since</th>
                    <td th:text="${#temporals.format(account.createdAt, 'd MMMM yyyy')}"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Change password (F10) -->
        <div class="col-lg-6">
          <div class="card shadow h-100">
            <div class="card-header bg-primary text-white">
              <h3 class="mb-0"><i class="bi bi-key me-2"></i>Change Password</h3>
            </div>
            <div class="card-body">
              <div th:if="${passwordChanged}" class="alert alert-success" role="status">
                <i class="bi bi-check-circle me-1"></i>Your password has been changed. Use the new one next time you sign in.
              </div>

              <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post" novalidate>
                <div class="mb-3">
                  <label for="currentPassword" class="form-label fw-semibold">Current password</label>
                  <input
                    id="currentPassword"
                    type="password"
                    class="form-control"
                    th:field="*{currentPassword}"
                    th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                    autocomplete="current-password"
                    required
                  />
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                </div>

                <div class="mb-3">
                  <label for="newPassword" class="form-label fw-semibold">New password</label>
                  <input
                    id="newPassword"
                    type="password"
                    class="form-control"
                    th:field="*{newPassword}"
                    th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                    autocomplete="new-password"
                    minlength="8"
                    required
                  />
                  <div class="form-text" th:unless="${#fields.hasErrors('newPassword')}">At least 8 characters.</div>
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                </div>

                <div class="mb-4">
                  <label for="confirmPassword" class="form-label fw-semibold">Confirm new password</label>
                  <input
                    id="confirmPassword"
                    type="password"
                    class="form-control"
                    th:field="*{confirmPassword}"
                    th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                    autocomplete="new-password"
                    required
                  />
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-check-circle me-1"></i>Change Password
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
