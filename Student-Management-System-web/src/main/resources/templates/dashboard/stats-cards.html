<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <body>
    <!--/* Every sub-fact below is derived from a real query. The previous
         version showed invented figures ("12% this month") that were not
         computed from anything. */-->
    <section class="stats-grid" th:fragment="statsCards" aria-label="Key statistics">
      <!-- Students -->
      <article class="stat-card">
        <span class="icon-box tint-blue" aria-hidden="true">
          <i class="bi bi-people-fill"></i>
        </span>
        <div class="stat-info">
          <p class="stat-label">Students</p>
          <p class="stat-value" th:text="${#numbers.formatInteger(totalStudents, 1, 'COMMA')}">0</p>
          <p class="stat-meta">
            <span th:text="${maleStudents} + ' male'">0 male</span>
            <span class="dot" aria-hidden="true">·</span>
            <span th:text="${femaleStudents} + ' female'">0 female</span>
            <th:block th:if="${otherStudents > 0}">
              <span class="dot" aria-hidden="true">·</span>
              <span th:text="${otherStudents} + ' other'">0 other</span>
            </th:block>
          </p>
        </div>
      </article>

      <!-- Teachers -->
      <article class="stat-card">
        <span class="icon-box tint-green" aria-hidden="true">
          <i class="bi bi-person-video3"></i>
        </span>
        <div class="stat-info">
          <p class="stat-label">Teachers</p>
          <p class="stat-value" th:text="${#numbers.formatInteger(totalTeachers, 1, 'COMMA')}">0</p>
          <p class="stat-meta" th:text="'across ' + ${departmentCount} + ' department' + (${departmentCount} == 1 ? '' : 's')">
            across 0 departments
          </p>
        </div>
      </article>

      <!-- Courses -->
      <article class="stat-card">
        <span class="icon-box tint-amber" aria-hidden="true">
          <i class="bi bi-book-fill"></i>
        </span>
        <div class="stat-info">
          <p class="stat-label">Courses</p>
          <p class="stat-value" th:text="${#numbers.formatInteger(totalCourses, 1, 'COMMA')}">0</p>
          <p class="stat-meta" th:text="${totalSubjects} + ' subjects in catalogue'">
            0 subjects in catalogue
          </p>
        </div>
      </article>

      <!-- Subjects -->
      <article class="stat-card">
        <span class="icon-box tint-pink" aria-hidden="true">
          <i class="bi bi-bookmark-fill"></i>
        </span>
        <div class="stat-info">
          <p class="stat-label">Subjects</p>
          <p class="stat-value" th:text="${#numbers.formatInteger(totalSubjects, 1, 'COMMA')}">0</p>
          <p class="stat-meta" th:text="${totalCredits} + ' credits total'">0 credits total</p>
        </div>
      </article>

      <!-- Fees: the headline is now money collected, not a record count.
           Admin-only, like the Fees pages themselves (C7). -->
      <article class="stat-card" sec:authorize="hasRole('ADMIN')">
        <span class="icon-box tint-cyan" aria-hidden="true">
          <i class="bi bi-cash-stack"></i>
        </span>
        <div class="stat-info">
          <p class="stat-label">Fees Collected</p>
          <p
            class="stat-value stat-value-sm"
            th:text="'₹' + ${#numbers.formatInteger(totalFeeAmount, 1, 'COMMA')}"
          >
            ₹0
          </p>
          <p class="stat-meta">
            <span th:text="${paidFees} + ' paid'">0 paid</span>
            <span class="dot" aria-hidden="true">·</span>
            <span th:text="${pendingFees} + ' pending'">0 pending</span>
            <th:block th:if="${overdueFees > 0}">
              <span class="dot" aria-hidden="true">·</span>
              <span class="stat-meta-alert" th:text="${overdueFees} + ' overdue'">0 overdue</span>
            </th:block>
          </p>
        </div>
      </article>

      <!-- Enrollments -->
      <article class="stat-card">
        <span class="icon-box tint-purple" aria-hidden="true">
          <i class="bi bi-person-check-fill"></i>
        </span>
        <div class="stat-info">
          <p class="stat-label">Enrollments</p>
          <p class="stat-value" th:text="${#numbers.formatInteger(totalEnrollments, 1, 'COMMA')}">0</p>
          <p class="stat-meta" th:text="${enrolledStudents} + ' unique students'">
            0 unique students
          </p>
        </div>
      </article>

      <!-- Attendance -->
      <article class="stat-card">
        <span class="icon-box tint-indigo" aria-hidden="true">
          <i class="bi bi-calendar-check-fill"></i>
        </span>
        <div class="stat-info">
          <p class="stat-label">Attendance</p>
          <p class="stat-value" th:text="${#numbers.formatInteger(totalAttendance, 1, 'COMMA')}">0</p>
          <p class="stat-meta" th:text="${presentCount} + ' marked present'">0 marked present</p>
        </div>
      </article>

      <!-- Exams -->
      <article class="stat-card">
        <span class="icon-box tint-rose" aria-hidden="true">
          <i class="bi bi-pencil-square"></i>
        </span>
        <div class="stat-info">
          <p class="stat-label">Exams</p>
          <p class="stat-value" th:text="${#numbers.formatInteger(totalExams, 1, 'COMMA')}">0</p>
          <p class="stat-meta" th:text="${upcomingExamCount} + ' upcoming'">0 upcoming</p>
        </div>
      </article>
    </section>
  </body>
</html>
