<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users</title>
  </head>

  <body>
    <!--/* Admin-only (/admin/** in SecurityConfig), so nothing here needs sec:authorize.
         Every change is a POST form: th:action adds the CSRF token. */-->
    <div class="container my-5" th:fragment="content">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
          <h3 class="mb-0"><i class="bi bi-people me-2"></i>User Accounts</h3>
          <span class="badge bg-light text-primary fs-6" th:text="${#lists.size(users)} + ' accounts'">0 accounts</span>
        </div>

        <div class="card-body p-4">
          <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="status">
            <i class="bi bi-check-circle me-1"></i><span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

          <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Username</th>
                  <th>Full Name</th>
                  <th>Email</th>
                  <th width="230">Role</th>
                  <th>Linked To</th>
                  <th class="text-center">Status</th>
                  <th>Member Since</th>
                  <th width="130" class="text-center">Account</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="u : ${users}" th:with="self=${u.username == me}" th:classappend="${!u.enabled} ? 'table-secondary'">
                  <td class="fw-semibold">
                    <span th:text="${u.username}">username</span>
                    <span th:if="${self}" class="badge bg-info text-dark ms-1">You</span>
                  </td>
                  <td th:text="${u.fullName}"></td>
                  <td th:text="${u.email}"></td>

                  <!--/* Role: a small form per row. Your own role cannot be changed. */-->
                  <td>
                    <span th:if="${self}" th:text="${#strings.replace(u.role, 'ROLE_', '')}">ADMIN</span>
                    <form th:unless="${self}" th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-flex gap-2">
                      <select name="role" class="form-select form-select-sm" th:aria-label="'Role for ' + ${u.username}">
                        <option
                          th:each="r : ${roles}"
                          th:value="${r}"
                          th:text="${#strings.replace(r, 'ROLE_', '')}"
                          th:selected="${r == u.role}"
                        ></option>
                      </select>
                      <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                    </form>
                  </td>

                  <!--/* The student or teacher this account belongs to (G10). A STUDENT
                       account can be linked to a student, a TEACHER account to a teacher. */-->
                  <td>
                    <div th:if="${u.student != null}" class="d-flex align-items-center gap-2">
                      <i class="bi bi-mortarboard text-muted" aria-hidden="true"></i>
                      <a th:href="@{/student/view/{id}(id=${u.student.id})}"
                         th:text="${u.student.firstName + ' ' + u.student.lastName}">Student</a>
                      <form th:action="@{/admin/users/{id}/unlink(id=${u.id})}" method="post" class="ms-auto">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Unlink</button>
                      </form>
                    </div>
                    <div th:if="${u.teacher != null}" class="d-flex align-items-center gap-2">
                      <i class="bi bi-person-video3 text-muted" aria-hidden="true"></i>
                      <a th:href="@{/teacher/view/{id}(id=${u.teacher.id})}"
                         th:text="${u.teacher.firstName + ' ' + u.teacher.lastName}">Teacher</a>
                      <form th:action="@{/admin/users/{id}/unlink(id=${u.id})}" method="post" class="ms-auto">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Unlink</button>
                      </form>
                    </div>

                    <form th:if="${u.student == null and u.role == 'ROLE_STUDENT'}"
                          th:action="@{/admin/users/{id}/link(id=${u.id})}" method="post" class="d-flex gap-2">
                      <select name="studentId" class="form-select form-select-sm" required
                              th:aria-label="'Student for ' + ${u.username}">
                        <option value="">-- Student --</option>
                        <option th:each="s : ${unlinkedStudents}" th:value="${s.id}"
                                th:text="${s.firstName + ' ' + s.lastName}"></option>
                      </select>
                      <button type="submit" class="btn btn-sm btn-outline-primary">Link</button>
                    </form>
                    <form th:if="${u.teacher == null and u.role == 'ROLE_TEACHER'}"
                          th:action="@{/admin/users/{id}/link(id=${u.id})}" method="post" class="d-flex gap-2">
                      <select name="teacherId" class="form-select form-select-sm" required
                              th:aria-label="'Teacher for ' + ${u.username}">
                        <option value="">-- Teacher --</option>
                        <option th:each="t : ${unlinkedTeachers}" th:value="${t.id}"
                                th:text="${t.firstName + ' ' + t.lastName}"></option>
                      </select>
                      <button type="submit" class="btn btn-sm btn-outline-primary">Link</button>
                    </form>
                    <span th:if="${u.role == 'ROLE_ADMIN'}" class="text-muted small">-</span>
                  </td>

                  <td class="text-center">
                    <span th:if="${u.enabled}" class="badge bg-success">Enabled</span>
                    <span th:unless="${u.enabled}" class="badge bg-secondary">Disabled</span>
                  </td>
                  <td th:text="${#temporals.format(u.createdAt, 'd MMM yyyy')}"></td>

                  <!--/* Enable or disable. You cannot disable yourself. */-->
                  <td class="text-center">
                    <span th:if="${self}" class="text-muted small">-</span>
                    <!--/* The confirm text is fixed on purpose: a username in a JavaScript
                         string would be script injection, since HTML escaping is undone
                         before the handler runs. */-->
                    <form th:unless="${self}" th:action="@{/admin/users/{id}/enabled(id=${u.id})}" method="post"
                          th:attr="onsubmit=${u.enabled} ? 'return confirm(\'Disable this account? It will not be able to sign in.\');' : null">
                      <input type="hidden" name="enabled" th:value="${!u.enabled}" />
                      <button
                        type="submit"
                        th:class="${u.enabled} ? 'btn btn-sm btn-outline-danger' : 'btn btn-sm btn-outline-success'"
                        th:text="${u.enabled} ? 'Disable' : 'Enable'"
                      >Disable</button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <p class="text-muted small mb-0">
            <i class="bi bi-info-circle me-1"></i>Changes apply at once: the account is signed out, and a disabled account cannot sign in again.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
