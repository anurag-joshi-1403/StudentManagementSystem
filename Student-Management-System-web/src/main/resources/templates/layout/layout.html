<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />

    <title th:text="${title} ?: 'Student Management System'">
      Student Management System
    </title>

    <!-- Typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons (icon font only; Bootstrap's own CSS is not
         loaded here so it cannot fight the design tokens) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Design tokens and base. MUST come before every component
         stylesheet below, which all consume its custom properties. -->
    <link rel="stylesheet" th:href="@{/css/theme.css}" />

    <!-- Components -->
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
    <link rel="stylesheet" th:href="@{/css/notification.css}" />
    <link rel="stylesheet" th:href="@{/css/welcome.css}" />
    <link rel="stylesheet" th:href="@{/css/stats-cards.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard-charts.css}" />
    <link rel="stylesheet" th:href="@{/css/quick-actions.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard-panels.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
  </head>

  <body class="app-shell">
    <div th:replace="~{common/sidebar :: sidebar}"></div>

    <div class="app-main">
      <div th:replace="~{common/navbar :: navbar}"></div>

      <div class="app-content">
        <!--/* Double-underscore preprocessing substitutes the model value
               into the fragment expression BEFORE it is parsed, so the
               ":: fragmentName" half is understood. Without it the whole
               string would be treated as a template name. */-->
        <div th:replace="~{__${content}__}"></div>
      </div>

      <div th:replace="~{common/footer :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/dashboard.js}"></script>
    <script th:src="@{/js/notification.js}"></script>
    <script th:src="@{/js/charts.js}"></script>
  </body>
</html>
