<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title th:text="${title}">Student Management System</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Sidebar CSS -->

    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
    <link rel="stylesheet" th:href="@{/css/welcome.css}">
    <link rel="stylesheet" th:href="@{/css/stats-cards.css}">
    <link rel="stylesheet" th:href="@{/css/quick-actions.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-panels.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/notification.css}">
  </head>

  <body>
    <!-- Sidebar -->

    <div th:replace="~{common/sidebar :: sidebar}"></div>

    <!-- Main Content -->

    <main style="margin-left: 270px; padding: 30px">
      <div th:replace="~{common/navbar :: navbar}"></div>
      

      <div th:replace="~{${content}}"></div>
      <div th:replace="~{common/footer :: footer}"></div>
    </main>
    <script th:src="@{/js/dashboard.js}"></script>
    <script th:src="@{/js/notification.js}"></script>
  </body>
</html>
