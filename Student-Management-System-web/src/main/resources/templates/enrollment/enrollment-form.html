<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Enrollment Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="container mt-4">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3
            th:text="${enrollment.id == null ? 'Add Enrollment' : 'Edit Enrollment'}"
          ></h3>
        </div>

        <div class="card-body">
          <form
            th:action="@{/enrollment}"
            th:object="${enrollment}"
            method="post"
          >
            <!-- Hidden ID -->

            <input type="hidden" th:field="*{id}" />

            <!-- Duplicate Error -->

            <div
              class="alert alert-danger"
              th:if="${duplicateError}"
              th:text="${duplicateError}"
            ></div>

            <!-- Student -->

            <div class="mb-3">
              <label class="form-label"> Student </label>

              <select class="form-select" th:field="*{student}" required>
                <option value="">---- Select Student ----</option>

                <option
                  th:each="student : ${students}"
                  th:value="${student.id}"
                  th:text="${student.firstName + ' ' + student.lastName}"
                ></option>
              </select>

              <div class="text-danger" th:errors="*{student}"></div>
            </div>

            <!-- Course -->

            <div class="mb-3">
              <label class="form-label"> Course </label>

              <select class="form-select" th:field="*{course}" required>
                <option value="">---- Select Course ----</option>

                <option
                  th:each="course : ${courses}"
                  th:value="${course.id}"
                  th:text="${course.courseName}"
                ></option>
              </select>

              <div class="text-danger" th:errors="*{course}"></div>
            </div>

            <!-- Academic Year -->

            <div class="mb-3">
              <label class="form-label"> Academic Year </label>

              <input
                type="text"
                class="form-control"
                placeholder="Example : 2026-2027"
                th:field="*{academicYear}"
              />

              <div class="text-danger" th:errors="*{academicYear}"></div>
            </div>

            <!-- Semester -->

            <div class="mb-3">
              <label class="form-label"> Semester </label>

              <select class="form-select" th:field="*{semester}">
                <option value="">Select Semester</option>

                <option value="1">Semester 1</option>

                <option value="2">Semester 2</option>

                <option value="3">Semester 3</option>

                <option value="4">Semester 4</option>

                <option value="5">Semester 5</option>

                <option value="6">Semester 6</option>

                <option value="7">Semester 7</option>

                <option value="8">Semester 8</option>
              </select>

              <div class="text-danger" th:errors="*{semester}"></div>
            </div>

            <!-- Status -->

            <div class="mb-4">
              <label class="form-label"> Status </label>

              <select class="form-select" th:field="*{status}">
                <option value="Active">Active</option>

                <option value="Inactive">Inactive</option>

                <option value="Completed">Completed</option>

                <option value="Dropped">Dropped</option>
              </select>
            </div>

            <!-- Buttons -->

            <button type="submit" class="btn btn-success">
              <i class="fa-solid fa-floppy-disk"></i>

              Save
            </button>

            <a th:href="@{/enrollment}" class="btn btn-secondary">
              <i class="fa-solid fa-arrow-left"></i>

              Back
            </a>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
