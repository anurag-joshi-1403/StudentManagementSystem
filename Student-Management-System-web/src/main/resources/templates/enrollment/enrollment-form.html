<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Enrollment Form</title>


  </head>

  <body>
    <div class="container mt-4" th:fragment="content">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3
            th:text="${enrollment.id == null ? 'Add Enrollment' : 'Edit Enrollment'}"
          ></h3>
        </div>

        <div class="card-body">
          <form
            th:action="@{/enrollment}"
            th:object="${enrollment}"
            method="post"
          >
            <input type="hidden" th:field="*{id}" />

            <!-- Student -->

            <div class="mb-3">
              <label class="form-label">Student</label>

              <select class="form-select" th:field="*{student}" required>
                <option value="">-- Select Student --</option>

                <option
                  th:each="student : ${students}"
                  th:value="${student.id}"
                  th:text="${student.firstName + ' ' + student.lastName}"
                ></option>
              </select>

              <div class="text-danger" th:errors="*{student}"></div>
            </div>

            <!-- Course -->

            <div class="mb-3">
              <label class="form-label">Course</label>

              <select class="form-select" th:field="*{course}" required>
                <option value="">-- Select Course --</option>

                <option
                  th:each="course : ${courses}"
                  th:value="${course.id}"
                  th:text="${course.courseName}"
                ></option>
              </select>

              <div class="text-danger" th:errors="*{course}"></div>
            </div>

            <!-- Subject -->

            <div class="mb-3">
              <label class="form-label">Subject</label>

              <select class="form-select" th:field="*{subject}" required>
                <option value="">-- Select Subject --</option>

                <option
                  th:each="subject : ${subjects}"
                  th:value="${subject.id}"
                  th:text="${subject.subjectName}"
                ></option>
              </select>

              <div class="text-danger" th:errors="*{subject}"></div>
            </div>

            <!-- Enrollment Date -->

            <div class="mb-4">
              <label class="form-label">Enrollment Date</label>

              <input
                type="date"
                class="form-control"
                th:field="*{enrollmentDate}"
              />

              <div class="text-danger" th:errors="*{enrollmentDate}"></div>
            </div>

            <button class="btn btn-success" type="submit">
              <i class="bi bi-floppy"></i>

              Save
            </button>

            <a th:href="@{/enrollment}" class="btn btn-secondary">
              <i class="bi bi-arrow-left"></i>

              Back
            </a>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
