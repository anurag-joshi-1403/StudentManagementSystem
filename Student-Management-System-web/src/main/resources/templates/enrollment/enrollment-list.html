<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <title>Enrollment Management</title>


  </head>

  <body>
    <div class="container mt-4" th:fragment="content">
      <!-- Header -->

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
          <i class="bi bi-mortarboard"></i>
          Enrollment Management
        </h2>

        <a th:href="@{/enrollment/new}" sec:authorize="hasRole('ADMIN')" class="btn btn-primary">
          <i class="bi bi-plus-lg"></i>
          Add Enrollment
        </a>
      </div>

      <!-- Search -->

      <form th:action="@{/enrollment}" method="get" class="row mb-3">
        <div class="col-md-10">
          <input
            type="text"
            class="form-control"
            name="keyword"
            th:value="${keyword}"
            placeholder="Search by Student, Course or Subject"
          />
        </div>

        <div class="col-md-2 d-grid">
          <button class="btn btn-success">
            <i class="bi bi-search"></i>

            Search
          </button>
        </div>
      </form>

      <!-- Table -->

      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>

              <th>Student</th>

              <th>Course</th>

              <th>Subject</th>

              <th>Enrollment Date</th>

              <th width="170">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr th:if="${#lists.isEmpty(enrollments)}">
              <td colspan="6" class="text-center text-danger">
                No Enrollment Found
              </td>
            </tr>

            <tr th:each="enrollment : ${enrollments}">
              <td th:text="${enrollment.id}"></td>

              <td
                th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}"
              ></td>

              <td th:text="${enrollment.course.courseName}"></td>

              <td th:text="${enrollment.subject.subjectName}"></td>

              <td th:text="${enrollment.enrollmentDate}"></td>

              <td>
                <a
                  th:href="@{/enrollment/view/{id}(id=${enrollment.id})}"
                  class="btn btn-info btn-sm text-white"
                  aria-label="View"
                >
                  <i class="bi bi-eye"></i>
                </a>

                <!--/* Everyone may view; only admins may change (C9) */-->
                <th:block sec:authorize="hasRole('ADMIN')">
                <a
                  th:href="@{/enrollment/edit/{id}(id=${enrollment.id})}"
                  class="btn btn-warning btn-sm"
                  aria-label="Edit"
                >
                  <i class="bi bi-pencil"></i>
                </a>

                <!--/* POST, not a link: a GET delete could be triggered by link
                     prefetch or a crawler, and CSRF protection does not cover GET.
                     th:action adds the CSRF token. */-->
                <form
                  th:action="@{/enrollment/delete/{id}(id=${enrollment.id})}"
                  method="post"
                  class="d-inline"
                  onsubmit="return confirm('Are you sure you want to delete this enrollment?');"
                >
                  <button type="submit" class="btn btn-danger btn-sm" aria-label="Delete">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
                </th:block>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->

      <nav th:if="${totalPages != null && totalPages > 1}">
        <ul class="pagination justify-content-center">
          <li
            class="page-item"
            th:classappend="${currentPage == 1}? 'disabled'"
          >
            <a
              class="page-link"
              th:href="@{/enrollment(keyword=${keyword}, page=${currentPage-1})}"
            >
              Previous
            </a>
          </li>

          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(1,totalPages)}"
            th:classappend="${currentPage==i}? 'active'"
          >
            <a
              class="page-link"
              th:text="${i}"
              th:href="@{/enrollment(keyword=${keyword}, page=${i})}"
            >
            </a>
          </li>

          <li
            class="page-item"
            th:classappend="${currentPage==totalPages}? 'disabled'"
          >
            <a
              class="page-link"
              th:href="@{/enrollment(keyword=${keyword}, page=${currentPage+1})}"
            >
              Next
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
