<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div class="notification-dropdown" th:fragment="notification">

    <div class="notification-header">

        <h5>Notifications</h5>

        <span>3 New</span>

    </div>

    <div class="notification-body">

        <div class="notification-item">

            <div class="notify-icon blue">

                <i class="bi bi-person-plus-fill"></i>

            </div>

            <div class="notify-content">

                <h6>New Student Registered</h6>

                <small>2 minutes ago</small>

            </div>

        </div>

        <div class="notification-item">

            <div class="notify-icon green">

                <i class="bi bi-cash-stack"></i>

            </div>

            <div class="notify-content">

                <h6>Fee Payment Received</h6>

                <small>15 minutes ago</small>

            </div>

        </div>

        <div class="notification-item">

            <div class="notify-icon orange">

                <i class="bi bi-pencil-square"></i>

            </div>

            <div class="notify-content">

                <h6>Exam Scheduled</h6>

                <small>Today</small>

            </div>

        </div>

    </div>

</div>

</body>
</html>
