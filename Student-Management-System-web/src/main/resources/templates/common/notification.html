<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<!--/* Filled by NotificationAdvice from live data (F1/F2): overdue fees,
     students under 75% attendance and exams in the next 7 days. */-->
<div class="notification-dropdown" id="notificationPanel" th:fragment="notification">

    <div class="notification-header">

        <h5>Notifications</h5>

        <span th:unless="${#lists.isEmpty(notifications)}"
              th:text="${#lists.size(notifications)} + ' New'">0 New</span>

    </div>

    <div class="notification-body">

        <a class="notification-item"
           th:each="n : ${notifications}"
           th:href="@{${n.link}}">

            <div class="notify-icon" th:classappend="${n.tone}">

                <i class="bi" th:classappend="${n.icon}" aria-hidden="true"></i>

            </div>

            <div class="notify-content">

                <h6 th:text="${n.title}">Title</h6>

                <small th:text="${n.detail}">Detail</small>

            </div>

        </a>

        <div class="notification-empty" th:if="${#lists.isEmpty(notifications)}">

            <i class="bi bi-check2-circle" aria-hidden="true"></i>

            <span>You're all caught up.</span>

        </div>

    </div>

</div>

</body>
</html>
