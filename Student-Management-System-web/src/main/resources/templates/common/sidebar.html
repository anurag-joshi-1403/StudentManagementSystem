<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <body>
    <!--/* The fragment is the <aside> itself (matching how navbar.html
         works) so it sits as a direct child of the .app-shell grid. */-->
    <aside class="sidebar" th:fragment="sidebar">
      <div class="sidebar-logo">
        <span class="sidebar-logo-mark">
          <i class="bi bi-mortarboard-fill"></i>
        </span>
        <span class="sidebar-logo-text">
          <strong>Student</strong>
          <small>Management System</small>
        </span>
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <p class="menu-title">Menu</p>

        <ul class="sidebar-menu">
          <li>
            <a
              th:href="@{/dashboard}"
              th:classappend="${activeNav == 'dashboard'} ? 'active'"
              th:attr="aria-current=${activeNav == 'dashboard'} ? 'page' : null"
            >
              <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>
              <span>Dashboard</span>
            </a>
          </li>

          <li>
            <a
              th:href="@{/student}"
              th:classappend="${activeNav == 'student'} ? 'active'"
              th:attr="aria-current=${activeNav == 'student'} ? 'page' : null"
            >
              <i class="bi bi-people-fill" aria-hidden="true"></i>
              <span>Students</span>
            </a>
          </li>

          <li>
            <a
              th:href="@{/teacher}"
              th:classappend="${activeNav == 'teacher'} ? 'active'"
              th:attr="aria-current=${activeNav == 'teacher'} ? 'page' : null"
            >
              <i class="bi bi-person-video3" aria-hidden="true"></i>
              <span>Teachers</span>
            </a>
          </li>

          <li>
            <a
              th:href="@{/course}"
              th:classappend="${activeNav == 'course'} ? 'active'"
              th:attr="aria-current=${activeNav == 'course'} ? 'page' : null"
            >
              <i class="bi bi-book-fill" aria-hidden="true"></i>
              <span>Courses</span>
            </a>
          </li>

          <li>
            <a
              th:href="@{/subject}"
              th:classappend="${activeNav == 'subject'} ? 'active'"
              th:attr="aria-current=${activeNav == 'subject'} ? 'page' : null"
            >
              <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
              <span>Subjects</span>
            </a>
          </li>

          <li>
            <a
              th:href="@{/enrollment}"
              th:classappend="${activeNav == 'enrollment'} ? 'active'"
              th:attr="aria-current=${activeNav == 'enrollment'} ? 'page' : null"
            >
              <i class="bi bi-person-check-fill" aria-hidden="true"></i>
              <span>Enrollment</span>
            </a>
          </li>

          <li>
            <a
              th:href="@{/attendance}"
              th:classappend="${activeNav == 'attendance'} ? 'active'"
              th:attr="aria-current=${activeNav == 'attendance'} ? 'page' : null"
            >
              <i class="bi bi-calendar-check-fill" aria-hidden="true"></i>
              <span>Attendance</span>
            </a>
          </li>

          <!--/* Fees are admin-only, viewing included (C7). */-->
          <li sec:authorize="hasRole('ADMIN')">
            <a
              th:href="@{/fee}"
              th:classappend="${activeNav == 'fee'} ? 'active'"
              th:attr="aria-current=${activeNav == 'fee'} ? 'page' : null"
            >
              <i class="bi bi-cash-stack" aria-hidden="true"></i>
              <span>Fees</span>
            </a>
          </li>

          <li>
            <a
              th:href="@{/exam}"
              th:classappend="${activeNav == 'exam'} ? 'active'"
              th:attr="aria-current=${activeNav == 'exam'} ? 'page' : null"
            >
              <i class="bi bi-pencil-square" aria-hidden="true"></i>
              <span>Examinations</span>
            </a>
          </li>

          <li>
            <a
              th:href="@{/result}"
              th:classappend="${activeNav == 'result'} ? 'active'"
              th:attr="aria-current=${activeNav == 'result'} ? 'page' : null"
            >
              <i class="bi bi-bar-chart-fill" aria-hidden="true"></i>
              <span>Results</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <!--/* A form, not a link: with CSRF enabled Spring Security only
             accepts POST /logout, and a GET just 404s while the session
             stays alive. th:action adds the CSRF token. */-->
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="logout-btn">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            <span>Logout</span>
          </button>
        </form>
      </div>
    </aside>
  </body>
</html>
