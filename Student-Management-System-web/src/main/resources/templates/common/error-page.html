<!doctype html>
<!--/* Shared body of every error page. Each file under templates/error/
     (and templates/error.html for any other status) replaces itself with
     this fragment, passing its own code, heading, message and icon.
     Standalone on purpose: error views render without the model data the
     app shell needs, so they rely on theme.css tokens alone. */-->
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="page(code, heading, message, icon)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />

    <title th:text="${code + ' · ' + heading + ' | Student Management System'}">
      Error | Student Management System
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/error-page.css}" />
  </head>

  <body class="error-shell">
    <main class="error-card surface-card">
      <span class="error-icon" aria-hidden="true">
        <i class="bi" th:classappend="${icon}"></i>
      </span>

      <p class="error-code" th:text="${code}">404</p>
      <h1 class="error-heading" th:text="${heading}">Page not found</h1>
      <p class="error-message" th:text="${message}">
        The page you asked for doesn’t exist.
      </p>

      <div class="error-actions">
        <a th:href="@{/dashboard}" class="error-btn error-btn-primary">
          <i class="bi bi-speedometer2" aria-hidden="true"></i>
          <span>Back to dashboard</span>
        </a>
        <button type="button" class="error-btn" onclick="history.back()">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          <span>Go back</span>
        </button>
      </div>
    </main>
  </body>
</html>
