# Test settings (F13). On the test classpath this file REPLACES
# src/main/resources/application.properties, so every setting the tests
# rely on must be repeated here.

spring.application.name=smsweb

# In-memory H2 in MySQL mode instead of MySQL, so the tests (and CI) need
# no database server. Each test run starts from an empty schema.
spring.datasource.url=jdbc:h2:mem:sms;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Same as the app
spring.mvc.format.date=iso
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
sms.institution-name=Student Management System

# No ADMIN_USERNAME/ADMIN_PASSWORD here, so AdminSeeder only logs that no
# admin exists; keep that and Hibernate's DDL out of the test output
logging.level.com.anurag.sms.config.AdminSeeder=ERROR
logging.level.org.hibernate.orm.deprecation=ERROR
